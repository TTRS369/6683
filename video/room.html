<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A Little Room for You</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 《A Little Room for You》故事 MV：逐帧确定性渲染。段落、逐句歌词、音效事件由 window.TIMELINE 注入。
// 这次画面以氛围为主：慢镜头推移、光线和季节的变化，不逐句图解歌词。
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const TL = window.TIMELINE;
const S = TL.sections, LYRICS = TL.lyrics, EV = TL.events;

// ---------- 工具 ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ss = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = 1) => ss(a, a + f, t) * (1 - ss(b - f, b, t));
const mod = (a, n) => ((a % n) + n) % n;
const prog = (k, t) => clamp((t - S[k][0]) / (S[k][1] - S[k][0]));
const mixc = (a, b, p) => a.map((v, i) => Math.round(lerp(v, b[i], p)));
const rgb = (a, al = 1) => `rgba(${a[0]},${a[1]},${a[2]},${al})`;
function glow(c, x, y, r, col, a) {
  if (r <= 0 || a <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.45, `rgba(${col},${a * 0.3})`); g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function vgrad(c, x, y, w, h, stops) { const g = c.createLinearGradient(0, y, 0, y + h); stops.forEach(([p, col]) => g.addColorStop(p, col)); c.fillStyle = g; c.fillRect(x, y, w, h); }
// 慢镜头：在 [t0,t1] 里从 (x0,y0,z0) 缓缓移到 (x1,y1,z1)
function camera(c, t, t0, t1, a, b) {
  const p = ss(t0, t1, t) * 0.5 + clamp((t - t0) / (t1 - t0)) * 0.5;
  const z = Math.max(1, lerp(a[2], b[2], p)), hw = W / 2 / z, hh = H / 2 / z;
  // 镜头不能移出画面范围，否则边缘会露黑
  const x = clamp(lerp(a[0], b[0], p), hw, W - hw), y = clamp(lerp(a[1], b[1], p), hh, H - hh);
  c.translate(W / 2, H / 2); c.scale(z, z); c.translate(-x, -y);
}

// ---------- 人物：老先生（原创） ----------
// 原点在双脚中间的地面。pose: stand | sit | walk；face 1 朝右 / -1 朝左；head: 头部转动（-1 回头 ~ 0 正常）；arm: 手臂动作
function oldMan(c, x, y, s, o = {}) {
  const face = o.face ?? 1, pose = o.pose || "stand", t = o.t || 0;
  const skin = "#e6c4a2", hair = "#d8d4cc", cardigan = "#c4ae84", shirt = "#7a8a9a", trousers = "#4e4438", shoe = "#2a2420";
  c.save(); c.translate(x, y); c.scale(s * face, s);
  const walk = pose === "walk" ? o.walk : null;
  const breathe = Math.sin(t * 1.6) * 1.2;
  if (pose === "sit") {
    // 腿：大腿水平向前，小腿垂下
    c.fillStyle = trousers; c.beginPath(); c.roundRect(-18, -92, 70, 24, 10); c.fill();
    c.beginPath(); c.roundRect(34, -84, 20, 80, 8); c.fill();
    c.fillStyle = shoe; c.beginPath(); c.roundRect(32, -8, 34, 10, 5); c.fill();
    c.translate(0, -78);
  } else {
    const sw = walk == null ? 0 : Math.sin(walk) * 16;
    c.fillStyle = trousers;
    for (const k of [-1, 1]) { c.save(); c.translate(0, -92); c.rotate((k * sw) * Math.PI / 180 * 1.4); c.beginPath(); c.roundRect(-11, 0, 22, 90, 9); c.fill(); c.fillStyle = shoe; c.beginPath(); c.roundRect(-10, 84, 32, 10, 5); c.fill(); c.restore(); }
    c.translate(0, -88);
  }
  // 身体（微驼），呼吸起伏
  c.save(); c.rotate(0.08);
  c.fillStyle = shirt; c.beginPath(); c.roundRect(-24, -118 + breathe, 50, 120, 18); c.fill();
  c.fillStyle = cardigan; c.beginPath(); c.roundRect(-28, -120 + breathe, 58, 124, 20); c.fill();
  c.fillStyle = "rgba(0,0,0,.08)"; c.fillRect(8, -110 + breathe, 3, 110);
  // 手臂
  const arm = o.arm ?? (walk == null ? 0.1 : Math.sin(walk) * 0.35);
  c.save(); c.translate(4, -104 + breathe); c.rotate(arm);
  c.fillStyle = cardigan; c.beginPath(); c.roundRect(-10, 0, 20, 86, 9); c.fill();
  c.fillStyle = skin; c.beginPath(); c.arc(0, 90, 9, 0, TAU); c.fill();
  if (o.hold === "bag") { c.fillStyle = "#d8c8a0"; c.beginPath(); c.roundRect(-20, 92, 40, 46, 6); c.fill(); c.fillStyle = "#6a9a5a"; c.beginPath(); c.arc(-6, 92, 8, 0, TAU); c.fill(); }
  if (o.hold === "phone") { c.fillStyle = "#1a1a1e"; c.fillRect(-6, 80, 14, 22); }
  if (o.hold === "cloth") { c.fillStyle = "#e8e2d6"; c.beginPath(); c.roundRect(-12, 86, 26, 16, 4); c.fill(); }
  c.restore();
  // 头
  c.save(); c.translate(6, -134 + breathe); c.rotate(-0.05 + (o.nod || 0));
  if (o.head) c.scale(1 - Math.abs(o.head) * 0.25, 1);
  c.fillStyle = skin; c.beginPath(); c.ellipse(0, 0, 25, 29, 0, 0, TAU); c.fill();
  c.beginPath(); c.arc(24, 4, 6, 0, TAU); c.fill();                     // 鼻子
  c.fillStyle = hair; c.beginPath(); c.ellipse(-8, -12, 24, 20, -0.3, Math.PI * 0.85, Math.PI * 2.05); c.fill();
  c.beginPath(); c.ellipse(-18, 6, 9, 16, 0, 0, TAU); c.fill();
  c.strokeStyle = "#5a5048"; c.lineWidth = 2; c.beginPath(); c.arc(12, -2, 7, 0, TAU); c.moveTo(5, -2); c.lineTo(-14, -4); c.stroke();  // 眼镜
  c.strokeStyle = "#8a6a5a"; c.lineWidth = 2;
  c.beginPath(); if (o.smile) c.arc(14, 12, 6, 0.2, Math.PI - 0.4); else { c.moveTo(10, 15); c.lineTo(18, 15); } c.stroke();
  c.restore();
  c.restore();
  c.restore();
}
// 她：只是一团带着红外套轮廓的暖光
function her(c, x, y, s, a, pose = "stand") {
  if (a <= 0) return;
  c.save(); c.globalAlpha = a; c.translate(x, y); c.scale(s, s);
  c.globalCompositeOperation = "lighter";
  glow(c, 0, pose === "sit" ? -110 : -150, 200, "255,200,150", 0.35);
  c.globalCompositeOperation = "source-over";
  c.filter = "blur(6px)";
  c.fillStyle = "rgba(190,80,70,.55)";
  if (pose === "sit") { c.beginPath(); c.roundRect(-30, -150, 62, 110, 26); c.fill(); c.beginPath(); c.roundRect(-10, -60, 70, 26, 12); c.fill(); }
  else { c.beginPath(); c.moveTo(-30, -190); c.quadraticCurveTo(0, -205, 30, -190); c.lineTo(44, -20); c.lineTo(-44, -20); c.closePath(); c.fill(); }
  c.fillStyle = "rgba(255,225,195,.55)"; c.beginPath(); c.arc(0, pose === "sit" ? -178 : -222, 24, 0, TAU); c.fill();
  c.filter = "none";
  c.restore();
}

// ---------- 客厅（大多数场景都在这里，用光线和季节区分） ----------
// mood: morning | rainy | evening | winter | night | spring
const MOODS = {
  morning: { wall: [214, 196, 168], light: "255,226,180", sky: [[0, "#bcd6e8"], [1, "#f4e6cc"]], lamp: 0, sun: 0.7 },
  rainy:   { wall: [150, 146, 140], light: "200,210,225", sky: [[0, "#6a7686"], [1, "#9aa2aa"]], lamp: 0.2, sun: 0 },
  evening: { wall: [150, 112, 92], light: "255,170,110", sky: [[0, "#4a4a72"], [1, "#e89a6a"]], lamp: 0.8, sun: 0.3 },
  winter:  { wall: [150, 156, 170], light: "220,230,255", sky: [[0, "#8a9ab0"], [1, "#d8e0ea"]], lamp: 0.6, sun: 0 },
  night:   { wall: [48, 52, 72], light: "170,190,255", sky: [[0, "#0a1024"], [1, "#22284a"]], lamp: 0, sun: 0 },
  spring:  { wall: [224, 206, 172], light: "255,232,185", sky: [[0, "#a8d0f0"], [1, "#f6ecd2"]], lamp: 0, sun: 1 },
};
const WINX = 1060, WINY = 210, WINW = 460, WINH = 470, DOOR = 210, FLOOR = 880, HER_CHAIR = 1640, HIS_CHAIR = 860;

function room(c, t, mood, o = {}) {
  const m = MOODS[mood];
  vgrad(c, 0, 0, W, FLOOR, [[0, rgb(mixc(m.wall, [0, 0, 0], 0.15))], [1, rgb(m.wall)]]);
  // 墙纸细纹
  c.fillStyle = "rgba(255,255,255,.035)"; for (let x = 0; x < W; x += 48) c.fillRect(x, 0, 18, FLOOR);
  // 窗外
  c.save(); c.beginPath(); c.rect(WINX, WINY, WINW, WINH); c.clip();
  vgrad(c, WINX, WINY, WINW, WINH, m.sky);
  outside(c, t, mood, o);
  c.restore();
  // 窗框、窗帘
  c.fillStyle = "#f0e8da"; c.fillRect(WINX - 14, WINY - 14, WINW + 28, 14); c.fillRect(WINX - 14, WINY + WINH, WINW + 28, 22); c.fillRect(WINX - 14, WINY, 14, WINH); c.fillRect(WINX + WINW, WINY, 14, WINH); c.fillRect(WINX + WINW / 2 - 5, WINY, 10, WINH);
  const sway = (o.breeze || 0) * Math.sin(t * 1.3) * 14;
  for (const side of [0, 1]) {
    const cx0 = side ? WINX + WINW + 10 : WINX - 90;
    c.fillStyle = "rgba(196,120,100,.75)"; c.beginPath(); c.moveTo(cx0, WINY - 40); c.lineTo(cx0 + 80, WINY - 40);
    c.quadraticCurveTo(cx0 + 70 + sway * (side ? -1 : 1), WINY + WINH / 2, cx0 + 86 + sway * (side ? -1.4 : 1.4), WINY + WINH + 30); c.lineTo(cx0 - 6, WINY + WINH + 30); c.closePath(); c.fill();
  }
  // 光从窗口照进来
  c.globalCompositeOperation = "lighter";
  if (m.sun > 0) { const g = c.createLinearGradient(WINX, WINY, WINX - 300, FLOOR + 200); g.addColorStop(0, `rgba(${m.light},${0.18 * m.sun})`); g.addColorStop(1, `rgba(${m.light},0)`); c.fillStyle = g; c.beginPath(); c.moveTo(WINX, WINY); c.lineTo(WINX + WINW, WINY); c.lineTo(WINX + WINW - 200, H); c.lineTo(WINX - 520, H); c.fill(); }
  for (let i = 0; i < 40; i++) { const q = rng(50 + i), x = WINX - 300 + q() * 700 + Math.sin(t * 0.3 + i) * 20, y = WINY + q() * 600 + Math.cos(t * 0.2 + i) * 14; c.fillStyle = `rgba(${m.light},${(0.15 + q() * 0.25) * (m.sun + 0.2)})`; c.fillRect(x, y, 2, 2); }
  c.globalCompositeOperation = "source-over";
  // 地板
  vgrad(c, 0, FLOOR, W, H - FLOOR, [[0, rgb(mixc([120, 90, 66], m.wall, 0.2))], [1, rgb(mixc([70, 52, 40], [0, 0, 0], 0.3))]]);
  c.strokeStyle = "rgba(0,0,0,.08)"; c.lineWidth = 2; for (let x = 0; x < W; x += 140) { c.beginPath(); c.moveTo(x, FLOOR); c.lineTo(x - 60, H); c.stroke(); }
  // 门和挂着的红外套
  c.fillStyle = rgb(mixc([120, 90, 70], m.wall, 0.25)); c.fillRect(DOOR - 100, 260, 200, FLOOR - 260);
  c.fillStyle = "rgba(0,0,0,.12)"; c.fillRect(DOOR - 82, 290, 164, 260); c.fillRect(DOOR - 82, 580, 164, 270);
  c.fillStyle = "#c8a060"; c.beginPath(); c.arc(DOOR + 70, 580, 7, 0, TAU); c.fill();
  c.fillStyle = "#6a5040"; c.fillRect(DOOR + 120, 330, 70, 8);
  coat(c, DOOR + 170, 338, o.coatSway || 0, t);
  // 墙上的钟
  c.fillStyle = "#5a4636"; c.beginPath(); c.arc(560, 280, 52, 0, TAU); c.fill();
  c.fillStyle = "#f2ead8"; c.beginPath(); c.arc(560, 280, 44, 0, TAU); c.fill();
  c.strokeStyle = "#3a2a20"; c.lineWidth = 3; c.lineCap = "round";
  const sec = Math.floor(t) * TAU / 60;
  c.beginPath(); c.moveTo(560, 280); c.lineTo(560 + Math.sin(t / 600) * 22, 280 - Math.cos(t / 600) * 22); c.moveTo(560, 280); c.lineTo(560 + Math.sin(t / 50) * 34, 280 - Math.cos(t / 50) * 34); c.stroke();
  c.strokeStyle = "#a83a2a"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(560, 280); c.lineTo(560 + Math.sin(sec) * 38, 280 - Math.cos(sec) * 38); c.stroke();
  // 书架和相框
  c.fillStyle = "#5a4232"; c.fillRect(420, 470, 300, 12); c.fillRect(420, 600, 300, 12);
  const br = rng(9); for (let i = 0; i < 10; i++) { c.fillStyle = ["#8a5a4a", "#5a6a5a", "#a08a5a", "#4a5a7a"][i % 4]; const bh = 60 + br() * 50; c.fillRect(440 + i * 26, 600 - bh, 20, bh); }
  c.fillStyle = "#3a2a20"; c.fillRect(600, 400, 70, 70); c.fillStyle = "#d8c8b0"; c.fillRect(606, 406, 58, 58);
  c.fillStyle = "rgba(190,90,80,.6)"; c.beginPath(); c.arc(624, 430, 9, 0, TAU); c.arc(646, 432, 9, 0, TAU); c.fill();   // 合照里的两个人
  // 落地灯
  c.fillStyle = "#3a3030"; c.fillRect(1590 - 60, 520, 6, FLOOR - 520);
  c.fillStyle = "#e8d6b0"; c.beginPath(); c.moveTo(1590 - 100, 520); c.lineTo(1590 - 20, 520); c.lineTo(1590 - 34, 460); c.lineTo(1590 - 86, 460); c.fill();
  if (m.lamp > 0) { c.globalCompositeOperation = "lighter"; glow(c, 1530, 540, 420, "255,190,120", 0.35 * m.lamp); c.globalCompositeOperation = "source-over"; }
  // 两把椅子：他的在桌边，她的在窗边
  armchair(c, HER_CHAIR, FLOOR, o.herChairClean ?? 0);
  table(c, 980, FLOOR, o);
  woodChair(c, HIS_CHAIR, FLOOR);
}
function coat(c, x, y, sway, t) {
  c.save(); c.translate(x, y); c.rotate(sway * Math.sin(t * 2) * 0.04);
  c.fillStyle = "#a8433c"; c.beginPath(); c.moveTo(-6, 0); c.quadraticCurveTo(-40, 10, -46, 60); c.lineTo(-52, 230); c.lineTo(52, 230); c.lineTo(46, 60); c.quadraticCurveTo(40, 10, 6, 0); c.closePath(); c.fill();
  c.fillStyle = "#8a3530"; c.beginPath(); c.moveTo(-6, 4); c.lineTo(-22, 60); c.lineTo(0, 70); c.lineTo(22, 60); c.lineTo(6, 4); c.fill();
  c.fillStyle = "#e0c070"; for (const by of [100, 140, 180]) { c.beginPath(); c.arc(8, by, 3.5, 0, TAU); c.fill(); }
  c.restore();
}
function armchair(c, x, y, clean) {
  const col = mixc([150, 120, 100], [190, 150, 120], clean);
  c.fillStyle = rgb(mixc(col, [0, 0, 0], 0.2)); c.beginPath(); c.roundRect(x - 110, y - 250, 220, 190, 30); c.fill();
  c.fillStyle = rgb(col); c.beginPath(); c.roundRect(x - 120, y - 120, 240, 80, 20); c.fill();
  c.beginPath(); c.roundRect(x - 140, y - 170, 44, 140, 18); c.fill(); c.beginPath(); c.roundRect(x + 96, y - 170, 44, 140, 18); c.fill();
  c.fillStyle = "#3a2a20"; c.fillRect(x - 110, y - 40, 14, 40); c.fillRect(x + 96, y - 40, 14, 40);
  if (clean > 0) { c.globalCompositeOperation = "lighter"; glow(c, x, y - 160, 220, "255,230,190", 0.18 * clean); c.globalCompositeOperation = "source-over"; }
}
function woodChair(c, x, y) {
  c.fillStyle = "#6a4a34"; c.fillRect(x - 50, y - 120, 100, 14); c.fillRect(x - 46, y - 106, 10, 106); c.fillRect(x + 36, y - 106, 10, 106);
  c.fillRect(x - 50, y - 260, 12, 140); c.fillRect(x - 50, y - 260, 70, 12);
}
function table(c, x, y, o) {
  c.fillStyle = "#7a5a40"; c.fillRect(x - 10, y - 160, 260, 16); c.fillStyle = "#5a4030"; c.fillRect(x + 10, y - 144, 14, 144); c.fillRect(x + 216, y - 144, 14, 144);
  // 桌上的杯子：平时一只；春天早上变成两只
  const cups = o.cups ?? 1;
  for (let i = 0; i < Math.ceil(cups); i++) {
    const cx = x + 70 + i * 70, a = clamp(cups - i);
    c.globalAlpha = a; c.fillStyle = i ? "#c8644e" : "#f0ece4"; c.beginPath(); c.roundRect(cx - 18, y - 200, 36, 40, 6); c.fill();
    c.strokeStyle = c.fillStyle; c.lineWidth = 4; c.beginPath(); c.arc(cx + 20, y - 182, 9, -1.2, 1.2); c.stroke();
    if (o.steam) { c.strokeStyle = `rgba(255,255,255,${0.25 * a})`; c.lineWidth = 2; c.beginPath(); for (let k = 0; k < 20; k++) c.lineTo(cx + Math.sin(k * 0.5 + (o.t || 0) * 2 + i) * 5, y - 206 - k * 3); c.stroke(); }
    c.globalAlpha = 1;
  }
  if (o.flowers) { const a = o.flowers; c.globalAlpha = a; c.fillStyle = "#9ab8c8"; c.beginPath(); c.roundRect(x + 190, y - 214, 30, 54, 8); c.fill(); for (let k = 0; k < 5; k++) { c.strokeStyle = "#5a8a4a"; c.lineWidth = 2; c.beginPath(); c.moveTo(x + 205, y - 212); c.lineTo(x + 190 + k * 8, y - 262 - (k % 2) * 14); c.stroke(); c.fillStyle = ["#f6d0d8", "#fff2b0", "#ffffff", "#f4b8c4", "#e8d8ff"][k]; c.beginPath(); c.arc(x + 190 + k * 8, y - 262 - (k % 2) * 14, 9, 0, TAU); c.fill(); } c.globalAlpha = 1; }
}
// 窗外：随季节和天气变化
function outside(c, t, mood, o) {
  // 对面的楼
  const r = rng(77);
  for (let i = 0; i < 6; i++) {
    const bx = WINX - 20 + i * 90, bh = 180 + r() * 180;
    c.fillStyle = mood === "night" ? "#151a30" : mood === "evening" ? "#6a5068" : mood === "rainy" ? "#7a808a" : "#c8c0b8";
    c.fillRect(bx, WINY + WINH - bh, 80, bh);
    for (let wy = WINY + WINH - bh + 20; wy < WINY + WINH - 20; wy += 40) for (let wx = bx + 12; wx < bx + 70; wx += 26) { const lit = r() < (mood === "night" || mood === "evening" ? 0.5 : 0.1); c.fillStyle = lit ? "rgba(255,210,140,.8)" : "rgba(0,0,0,.12)"; c.fillRect(wx, wy, 14, 22); }
  }
  // 树枝：冬天光秃，春天开花
  const bloom = o.bloom ?? (mood === "spring" ? 1 : 0);
  c.strokeStyle = mood === "night" ? "#0a0c18" : "#5a4a40"; c.lineWidth = 8; c.lineCap = "round";
  c.beginPath(); c.moveTo(WINX + WINW + 20, WINY + 120); c.quadraticCurveTo(WINX + 300, WINY + 140, WINX + 180, WINY + 90); c.stroke();
  c.lineWidth = 4; c.beginPath(); c.moveTo(WINX + 320, WINY + 135); c.lineTo(WINX + 260, WINY + 60); c.moveTo(WINX + 240, WINY + 110); c.lineTo(WINX + 200, WINY + 150); c.stroke();
  if (bloom > 0) { const br = rng(88); for (let i = 0; i < 40; i++) { const k = clamp(bloom * 1.5 - br() * 0.5); if (k <= 0) continue; c.fillStyle = `rgba(255,${200 + br() * 30 | 0},${215 + br() * 20 | 0},${0.9 * k})`; c.beginPath(); c.arc(WINX + 180 + br() * 300, WINY + 50 + br() * 110, 7 * k, 0, TAU); c.fill(); } }
  if (mood === "winter" || o.snow) { const a = o.snow ?? 1; for (let i = 0; i < 90; i++) { const q = rng(300 + i), x = WINX + mod(q() * WINW + Math.sin(t + i) * 12, WINW), y = WINY + mod(q() * WINH + t * (30 + q() * 30), WINH); c.fillStyle = `rgba(255,255,255,${0.8 * a})`; c.beginPath(); c.arc(x, y, 2 + q() * 2, 0, TAU); c.fill(); } }
  if (mood === "night") { c.fillStyle = "#f2eed8"; c.beginPath(); c.arc(WINX + 360, WINY + 90, 30, 0, TAU); c.fill(); c.globalCompositeOperation = "lighter"; glow(c, WINX + 360, WINY + 90, 140, "200,210,255", 0.3); c.globalCompositeOperation = "source-over"; }
  if (mood === "rainy") { c.strokeStyle = "rgba(220,230,245,.45)"; c.lineWidth = 1.5; for (let i = 0; i < 70; i++) { const q = rng(400 + i), x = WINX + mod(q() * WINW + t * 30, WINW), y = WINY + mod(q() * WINH + t * 600, WINH); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 4, y + 18); c.stroke(); } }
  if (mood === "spring" || mood === "morning") birds(c, t, WINX, WINY, WINW);
}
function birds(c, t, x0, y0, w) {
  c.strokeStyle = "rgba(60,60,70,.7)"; c.lineWidth = 2.5;

function titleCard(c, t, a, b, title, sub) {
  const al = win(t, a, b, 1.8);
  if (al <= 0) return;
  c.save(); c.globalAlpha = al; c.textAlign = "center"; c.textBaseline = "middle";
  c.font = 'italic 400 92px "Noto Serif SC", serif'; c.letterSpacing = "4px";
  c.fillStyle = "#fff8ee"; c.shadowColor = "rgba(0,0,0,.45)"; c.shadowBlur = 24;
  c.fillText(title, W / 2, H * 0.4);
  if (sub) { c.shadowBlur = 10; c.font = '400 26px "Noto Serif SC", serif'; c.letterSpacing = "3px"; c.fillStyle = "rgba(255,248,238,.9)"; c.fillText(sub, W / 2, H * 0.4 + 90); }
  c.restore();
}

// ---------- 编排 ----------
const SCENES = [
  [sMorning, 0, S.pre1[0]], [sWindow, S.pre1[0], S.ch1[0]], [sMemory, S.ch1[0], S.v2[0]], [sStore, S.v2[0], S.pre2[0]],
  [sWalk, S.pre2[0], S.ch2[0]], [sSeasons, S.ch2[0], S.bridge[0]], [sNight, S.bridge[0], S.fin[0]], [sSpring, S.fin[0], S.outro[0]], [sOutro, S.outro[0], TL.duration + 1],
];
const FADE = 1.4;
const layers = [0, 1].map(() => { const o = document.createElement("canvas"); o.width = W; o.height = H; return o; });
const LYRIC_BG = (() => { const g = ctx.createLinearGradient(0, H - 260, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.5)"); return g; })();
const VIG = (() => { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.22)"); return g; })();

function drawLyrics(t) {
  ctx.fillStyle = LYRIC_BG; ctx.fillRect(0, H - 260, W, 260);
  for (const [a, b, en, zh] of LYRICS) {
    // 上一句在自己的结束时刻前淡出，下一句再淡入，两行不会叠在一起
    if (t < a - 0.3 || t > b) continue;
    ctx.save(); ctx.globalAlpha = Math.min(ss(a - 0.3, a + 0.1, t), 1 - ss(b - 0.3, b, t)); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = 12; ctx.fillStyle = "#fffaf2";
    ctx.font = 'italic 400 48px "Noto Serif SC", serif'; ctx.letterSpacing = "1px"; ctx.fillText(en, W / 2, H - 128);
    ctx.font = '400 30px "Noto Serif SC", serif'; ctx.letterSpacing = "4px"; ctx.fillStyle = "rgba(255,246,232,.85)"; ctx.fillText(zh, W / 2, H - 72);
    ctx.restore();
  }
}

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; ctx.filter = "none";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let li = 0;
  for (const [fn, a, b] of SCENES) {
    if (t < a - FADE || t > b + FADE) continue;
    const al = Math.min(ss(a - FADE, a + FADE, t), 1 - ss(b - FADE, b + FADE, t));
    if (al <= 0) continue;
    const L = layers[li++ % 2], c = L.getContext("2d");
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.filter = "none"; c.clearRect(0, 0, W, H);
    fn(c, t);
    ctx.globalAlpha = a <= 0 ? 1 : al; ctx.drawImage(L, 0, 0); ctx.globalAlpha = 1;
  }
  // 轻微暗角（不加胶片颗粒和漏光，保持画面干净清晰）
  ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(0,0,0,${Math.max(1 - ss(0, 3, t), ss(TL.duration - 3, TL.duration, t))})`; ctx.fillRect(0, 0, W, H);
  drawLyrics(t);
}

window.renderAt = renderAt;
window.ready = document.fonts.load('italic 48px "Noto Serif SC"').then(() => document.fonts.load('30px "Noto Serif SC"')).then(() => { renderAt(0); return true; });
</script>
