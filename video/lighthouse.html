<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>守灯人</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 《守灯人》MV：逐帧确定性渲染。段落时间和逐帧音乐能量由 window.TIMELINE 注入（不含歌词）。
// 故事：黄昏他出海；入夜灯塔亮起；风暴来袭，闪电劈断电源；她爬上灯塔点亮备用灯、手摇镜片；
// 迷航的小船循着光回来；暴风眼里两人都快撑不住；天亮，他回到码头。
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const TL = window.TIMELINE, S = TL.sections, FPS = TL.fps;

// ---------- 工具 ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ss = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = 1) => ss(a, a + f, t) * (1 - ss(b - f, b, t));
const mod = (a, n) => ((a % n) + n) % n;
const E = t => TL.energy[clamp(Math.floor(t * FPS), 0, TL.energy.length - 1)];
const mixc = (a, b, p) => a.map((v, i) => Math.round(lerp(v, b[i], p)));
const rgb = (a, al = 1) => `rgba(${a[0]},${a[1]},${a[2]},${al})`;
function glow(c, x, y, r, col, a) {
  if (r <= 0 || a <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(0.4, `rgba(${col},${a * 0.3})`); g.addColorStop(1, `rgba(${col},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}

// ---------- 故事状态（所有镜头共用） ----------
// 风暴强度 0~1：副歌前起风，暴风眼里短暂平静，天亮后散去
const storm = t => ss(S.storm[0] - 6, S.storm[0] + 4, t) * (1 - 0.85 * win(t, S.bridge[0], S.dawn[0], 2.5)) * (1 - ss(S.dawn[0], S.dawn[0] + 16, t));
// 天色：0 黄昏 → 1 深夜 → 天亮回到 0
const night = t => ss(S.dusk[0] + 18, S.night[0] + 4, t) * (1 - ss(S.dawn[0] - 1, S.dawn[0] + 20, t));
const dawnP = t => ss(S.dawn[0] - 1.5, S.dawn[0] + 24, t);
const RELIGHT = S.beam[0] - 2.5;      // 她在灯室里点亮备用灯
// 灯：入夜点亮；闪电劈中后熄灭；备用灯点亮后重新扫出去；尾声里慢慢熄灭
const lamp = t => {
  if (t < S.night[0]) return 0;
  if (t < S.dark[0]) return ss(S.night[0], S.night[0] + 0.6, t);
  if (t < RELIGHT) return 0;
  return ss(RELIGHT, S.beam[0], t) * (1 - ss(S.outro[0] + 2, S.outro[0] + 8, t));
};
const STRIKES = [S.storm[0] + 13.2, S.storm[0] + 23.5, S.dark[0], S.dark[0] + 2.6, S.dark[0] + 5.2, S.climb[0] + 14, S.climb[0] + 30, S.beam[0] + 7.4, S.beam[0] + 19.5];
const flash = t => STRIKES.reduce((m, s) => Math.max(m, t >= s ? Math.exp(-(t - s) * 6) : 0), 0);

// 世界坐标（远景）：左边悬崖上是灯塔，悬崖脚下是码头
const HORIZON = 540, LH_X = 330, LH_BASE = 600, LAMP_Y = 214, DOCK = [640, 832];
function boatWide(t) {
  const k = [
    [0, 700, 836, 0.95], [S.night[0] - 1, 1450, 602, 0.36], [S.storm[0], 1540, 608, 0.34], [S.dark[0], 1520, 612, 0.34],
    [S.beam[0], 1660, 604, 0.3], [S.bridge[0], 1260, 640, 0.44], [S.dawn[0], 1020, 688, 0.6], [S.dawn[0] + 28, 720, 834, 0.95], [999, 720, 834, 0.95],
  ];
  let i = 0; while (t > k[i + 1][0]) i++;
  const p = ss(k[i][0], k[i + 1][0], t), st = storm(t);
  return { x: lerp(k[i][1], k[i + 1][1], p), y: lerp(k[i][2], k[i + 1][2], p) + Math.sin(t * 1.6) * (2 + st * 10), s: lerp(k[i][3], k[i + 1][3], p), tilt: Math.sin(t * 1.3) * (0.05 + st * 0.3) };
}

// ---------- 天空、海、雨、云、闪电 ----------
function sky(c, t) {
  const n = night(t), d = dawnP(t);
  const top = mixc(mixc([92, 74, 128], [8, 12, 30], n), [120, 170, 220], d), mid = mixc(mixc([236, 132, 96], [22, 30, 62], n), [250, 200, 150], d), low = mixc(mixc([252, 196, 128], [36, 44, 80], n), [255, 226, 170], d);
  const g = c.createLinearGradient(0, 0, 0, HORIZON); g.addColorStop(0, rgb(top)); g.addColorStop(0.7, rgb(mid)); g.addColorStop(1, rgb(low));
  c.fillStyle = g; c.fillRect(-200, -200, W + 400, HORIZON + 200);
  // 太阳：黄昏落下，天亮升起
  const sunY = t < S.night[0] ? lerp(380, 600, ss(0, S.night[0] - 2, t)) : lerp(620, 300, ss(S.dawn[0], S.outro[1], t));
  const sunA = t < S.night[0] ? 1 : ss(S.dawn[0] - 1, S.dawn[0] + 4, t);
  if (sunA > 0) { c.globalCompositeOperation = "lighter"; glow(c, 1300, sunY, 420, "255,180,110", 0.55 * sunA); c.globalCompositeOperation = "source-over"; c.fillStyle = `rgba(255,232,190,${sunA})`; c.beginPath(); c.arc(1300, sunY, 58, 0, TAU); c.fill(); }
  // 晨光那一记重击：海平线上炸开一道光
  const burst = win(t, S.dawn[0], S.dawn[0] + 5, 0.15) * (1 - ss(S.dawn[0], S.dawn[0] + 5, t));
  if (burst > 0) { c.globalCompositeOperation = "lighter"; const g2 = c.createLinearGradient(0, HORIZON - 160, 0, HORIZON + 30); g2.addColorStop(0, "rgba(255,210,150,0)"); g2.addColorStop(0.8, `rgba(255,220,160,${0.9 * burst})`); g2.addColorStop(1, "rgba(255,220,160,0)"); c.fillStyle = g2; c.fillRect(-200, HORIZON - 160, W + 400, 190); c.globalCompositeOperation = "source-over"; }
  // 星星（被云遮住时变暗）
  const sa = n * (1 - 0.8 * storm(t)) * (1 - dawnP(t));
  if (sa > 0.01) { const r = rng(3); for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * HORIZON * 0.9, s = 0.8 + r() * 1.6; c.fillStyle = `rgba(235,238,255,${sa * (0.4 + 0.6 * Math.abs(Math.sin(t * (0.5 + r()) + i)))})`; c.fillRect(x, y, s, s); } }
}
function clouds(c, t) {
  const st = storm(t), d = dawnP(t);
  const cover = Math.max(st, 0.25 * ss(S.dusk[0] + 20, S.storm[0], t) * (1 - d));
  if (cover < 0.02) return;
  const col = mixc(mixc([60, 56, 74], [22, 24, 34], night(t)), [250, 210, 190], d);
  for (let i = 0; i < 16; i++) {
    const q = rng(40 + i), x = mod(q() * W * 1.6 + t * (8 + q() * 16) * (1 + st * 2), W + 800) - 400, y = 40 + q() * 300;
    c.fillStyle = rgb(col, 0.55 * cover * (0.5 + 0.5 * q()));
    for (let k = 0; k < 5; k++) { c.beginPath(); c.ellipse(x + k * 90, y + Math.sin(k * 2 + i) * 18, 150 + q() * 60, 50 + q() * 30, 0, 0, TAU); c.fill(); }
  }
}
function sea(c, t, horizon, scale = 1) {
  const st = storm(t), n = night(t), d = dawnP(t), e = E(t);
  const deep = mixc(mixc([60, 70, 120], [6, 14, 28], n), [70, 120, 170], d), near = mixc(mixc([120, 90, 120], [10, 22, 40], n), [150, 170, 190], d);
  const g = c.createLinearGradient(0, horizon, 0, H); g.addColorStop(0, rgb(deep)); g.addColorStop(1, rgb(near));
  c.fillStyle = g; c.fillRect(-200, horizon, W + 400, H - horizon + 200);
  // 一层层的浪，从远到近越来越高；风暴里浪尖翻起白沫
  for (let k = 0; k < 9; k++) {
    const depth = k / 8, y0 = horizon + Math.pow(depth, 1.7) * (H - horizon) * 1.05, amp = (2 + depth * 14) * scale * (1 + st * (3 + 3 * e)), fq = 0.012 / (0.4 + depth), sp = 0.6 + st * 1.6;
    c.fillStyle = rgb(mixc(deep, near, depth), 0.5 + 0.4 * depth);
    c.beginPath(); c.moveTo(-200, H + 200);
    for (let x = -200; x <= W + 200; x += 16) c.lineTo(x, y0 + Math.sin(x * fq + t * sp + k * 1.7) * amp + Math.sin(x * fq * 2.3 - t * sp * 1.3 + k) * amp * 0.4);
    c.lineTo(W + 200, H + 200); c.fill();
    if (st > 0.3 && k > 2) { c.strokeStyle = `rgba(230,240,250,${0.35 * st * depth})`; c.lineWidth = 2; for (let x = -200; x <= W + 200; x += 16) { const yy = y0 + Math.sin(x * fq + t * sp + k * 1.7) * amp + Math.sin(x * fq * 2.3 - t * sp * 1.3 + k) * amp * 0.4; if (Math.sin(x * fq + t * sp + k * 1.7) > 0.85) { c.beginPath(); c.moveTo(x, yy); c.lineTo(x + 14, yy - 2); c.stroke(); } } }
  }
}
function rain(c, t, gain = 1) {
  const a = storm(t) * gain;
  if (a < 0.03) return;
  c.strokeStyle = `rgba(210,220,240,${0.35 * a})`; c.lineWidth = 1.6;
  for (let i = 0; i < 420 * a; i++) { const q = rng(600 + i), x = mod(q() * W * 1.3 - t * 380, W + 300) - 150, y = mod(q() * H + t * (1100 + q() * 400), H + 60) - 30; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 14, y + 34); c.stroke(); }
}
function lightning(c, t, tx = LH_X, ty = LAMP_Y - 50) {
  for (const s of STRIKES) {
    const k = t >= s ? Math.exp(-(t - s) * 5) : 0;
    if (k < 0.05) continue;
    const r = rng(Math.round(s * 10)), x0 = tx + (r() - 0.5) * 900;
    c.strokeStyle = `rgba(235,240,255,${k})`; c.lineWidth = 3; c.shadowColor = "rgba(200,220,255,.9)"; c.shadowBlur = 20;
    c.beginPath(); let x = x0, y = -20; c.moveTo(x, y);
    while (y < ty) { y += 30 + r() * 40; x += (r() - 0.5) * 70 + (tx - x) * 0.08; c.lineTo(x, Math.min(y, ty)); }
    c.stroke(); c.shadowBlur = 0;
  }
}

// ---------- 灯塔、悬崖、码头、小船 ----------
function cliff(c, t) {
  const col = mixc(mixc([60, 40, 54], [10, 10, 18], night(t)), [90, 70, 70], dawnP(t));
  c.fillStyle = rgb(col);
  c.beginPath(); c.moveTo(-200, H + 100); c.lineTo(-200, 560); c.lineTo(120, 590); c.lineTo(250, 596); c.lineTo(470, 604); c.lineTo(540, 660); c.lineTo(580, 760); c.lineTo(600, 860); c.lineTo(560, H + 100); c.fill();
  // 从灯塔下到码头的小路
  c.strokeStyle = rgb(mixc(col, [200, 180, 160], 0.25)); c.lineWidth = 3; c.setLineDash([10, 8]);
  c.beginPath(); c.moveTo(380, 602); c.lineTo(500, 640); c.lineTo(450, 700); c.lineTo(560, 760); c.lineTo(520, 810); c.lineTo(620, 830); c.stroke(); c.setLineDash([]);
  // 码头
  c.fillStyle = rgb(mixc([90, 60, 44], [20, 16, 18], night(t)));
  c.fillRect(560, 828, 260, 12); for (let x = 570; x < 820; x += 40) c.fillRect(x, 840, 8, 60);
}
function lighthouse(c, t, beamOn = true) {
  const n = night(t), body = mixc([238, 230, 220], [70, 72, 90], n), red = mixc([190, 58, 50], [60, 26, 30], n), lv = lamp(t), e = E(t);
  // 塔身：红白条纹，上窄下宽
  const top = LAMP_Y + 34, bw = 70, tw = 44;
  for (let i = 0; i < 6; i++) {
    const y0 = lerp(LH_BASE, top, i / 6), y1 = lerp(LH_BASE, top, (i + 1) / 6), w0 = lerp(bw, tw, i / 6), w1 = lerp(bw, tw, (i + 1) / 6);
    c.fillStyle = rgb(i % 2 ? red : body); c.beginPath(); c.moveTo(LH_X - w0, y0); c.lineTo(LH_X + w0, y0); c.lineTo(LH_X + w1, y1); c.lineTo(LH_X - w1, y1); c.fill();
  }
  c.fillStyle = rgb(mixc([40, 40, 50], [10, 10, 16], n)); c.fillRect(LH_X - 60, top - 8, 120, 10);          // 平台
  c.strokeStyle = rgb(mixc([40, 40, 50], [10, 10, 16], n)); c.lineWidth = 2; c.strokeRect(LH_X - 60, top - 26, 120, 18);
  // 灯室玻璃
  c.fillStyle = lv > 0 ? `rgba(255,236,180,${0.4 + 0.6 * lv})` : rgb(mixc([120, 140, 160], [26, 30, 44], n));
  c.fillRect(LH_X - 30, LAMP_Y - 20, 60, 46);
  c.fillStyle = rgb(red); c.beginPath(); c.moveTo(LH_X - 40, LAMP_Y - 20); c.lineTo(LH_X, LAMP_Y - 60); c.lineTo(LH_X + 40, LAMP_Y - 20); c.fill();
  // 窗户：她在上面的时候亮着
  c.fillStyle = `rgba(255,210,140,${0.5 * n})`; for (const wy of [520, 440, 360]) c.fillRect(LH_X - 6, wy, 12, 20);
  // 旋转的光束：转到朝向镜头时最亮
  if (lv > 0 && beamOn) {
    const ang = t * 0.9, facing = Math.sin(ang), dir = Math.cos(ang), len = 1900 * Math.abs(dir), half = 110 + 160 * (1 - Math.abs(dir));
    c.globalCompositeOperation = "lighter";
    const bx = LH_X + dir * len, g = c.createLinearGradient(LH_X, LAMP_Y, bx, LAMP_Y);
    g.addColorStop(0, `rgba(255,240,200,${0.5 * lv * (0.7 + 0.3 * e)})`); g.addColorStop(1, "rgba(255,240,200,0)");
    c.fillStyle = g; c.beginPath(); c.moveTo(LH_X, LAMP_Y - 6); c.lineTo(bx, LAMP_Y - half); c.lineTo(bx, LAMP_Y + half); c.lineTo(LH_X, LAMP_Y + 6); c.fill();
    glow(c, LH_X, LAMP_Y, 90 + 260 * Math.max(0, facing), "255,236,190", lv * (0.5 + 0.5 * Math.max(0, facing)));
    c.globalCompositeOperation = "source-over";
  }
}
function boat(c, x, y, s, tilt, t, o = {}) {
  c.save(); c.translate(x, y); c.rotate(tilt); c.scale(s, s);
  const n = night(t), hull = mixc([150, 70, 50], [40, 26, 26], n);
  c.fillStyle = rgb(hull); c.beginPath(); c.moveTo(-90, -10); c.lineTo(90, -10); c.quadraticCurveTo(80, 24, 50, 30); c.lineTo(-56, 30); c.quadraticCurveTo(-84, 22, -90, -10); c.fill();
  c.fillStyle = rgb(mixc([230, 220, 200], [60, 60, 70], n)); c.fillRect(-90, -14, 180, 6);
  // 渔夫：深蓝外套、毛线帽（他上了码头以后船是空的）
  const row = o.rowing ? Math.sin(t * 3.2) : 0;
  if (!o.empty) {
  c.fillStyle = rgb(mixc([40, 60, 100], [14, 18, 34], n)); c.beginPath(); c.roundRect(-16, -78, 32, 66, 12); c.fill();
  c.fillStyle = rgb(mixc([220, 180, 150], [70, 60, 60], n)); c.beginPath(); c.arc(0, -92, 15, 0, TAU); c.fill();
  c.fillStyle = rgb(mixc([170, 50, 46], [50, 20, 24], n)); c.beginPath(); c.arc(0, -98, 16, Math.PI, 0); c.fill();
  c.strokeStyle = rgb(mixc([120, 90, 60], [30, 24, 20], n)); c.lineWidth = 5; c.lineCap = "round";
  c.beginPath(); c.moveTo(4, -56); c.lineTo(80 + row * 20, 10 + row * 10); c.stroke();
  }
  // 船头的小马灯
  c.fillStyle = "#222"; c.fillRect(70, -40, 4, 30);
  c.globalCompositeOperation = "lighter"; glow(c, 72, -44, 60 / s * 0.6 + 20, "255,190,110", 0.7 * (0.3 + 0.7 * n)); c.globalCompositeOperation = "source-over";
  c.fillStyle = "rgba(255,220,160,.95)"; c.beginPath(); c.arc(72, -44, 5, 0, TAU); c.fill();
  // 被灯塔的光照到
  if (o.lit > 0) { c.globalCompositeOperation = "lighter"; glow(c, 0, -60, 220, "255,240,200", 0.45 * o.lit); c.globalCompositeOperation = "source-over"; }
  c.restore();
}
// 他上岸以后站着的样子（面朝左，伸手迎向她）
function fisherman(c, x, y, s, t, o = {}) {
  c.save(); c.translate(x, y); c.scale(-s, s);
  c.fillStyle = "#283c64"; c.beginPath(); c.roundRect(-18, -150, 36, 96, 14); c.fill();
  c.strokeStyle = "#1e2232"; c.lineWidth = 12; c.lineCap = "round"; c.beginPath(); c.moveTo(-6, -56); c.lineTo(-8, -2); c.moveTo(6, -56); c.lineTo(8, -2); c.stroke();
  c.fillStyle = "#e0b896"; c.beginPath(); c.arc(0, -168, 17, 0, TAU); c.fill();
  c.fillStyle = "#a8322e"; c.beginPath(); c.arc(0, -174, 18, Math.PI, 0); c.fill();
  c.strokeStyle = "#283c64"; c.lineWidth = 12; c.beginPath(); c.moveTo(-8, -130); c.lineTo(-40 * (0.4 + (o.reach ?? 1)), -110); c.stroke();
  c.restore();
}
// 她：黄色雨衣、扎马尾。pose: stand | climb | crank | run
function keeper(c, x, y, s, t, o = {}) {
  const pose = o.pose || "stand";
  c.save(); c.translate(x, y); c.scale(s * (o.face ?? 1), s);
  const coat = "#e3a92e", dark = "#2a2230", skin = "#e8c4a0";
  const step = pose === "climb" || pose === "run" ? Math.sin(t * (pose === "run" ? 10 : 5)) : 0;
  c.strokeStyle = dark; c.lineWidth = 10; c.lineCap = "round";
  c.beginPath(); c.moveTo(-6, -60); c.lineTo(-8 + step * 14, -4 - Math.max(0, step) * 12); c.moveTo(6, -60); c.lineTo(8 - step * 14, -4 - Math.max(0, -step) * 12); c.stroke();
  c.fillStyle = coat; c.beginPath(); c.moveTo(-22, -140); c.quadraticCurveTo(0, -150, 22, -140); c.lineTo(28, -56); c.lineTo(-28, -56); c.closePath(); c.fill();
  // 手臂：摇手柄时绕圈，提灯时向前
  let ax = 26, ay = -100;
  if (pose === "crank") { const a = t * (o.slow ? 2.2 : 4.5); ax = 40 + Math.cos(a) * 16; ay = -104 + Math.sin(a) * 16; }
  if (pose === "climb") { ax = 30; ay = -96; }
  if (pose === "run") { ax = 20 + step * 14; ay = -92; }
  c.strokeStyle = coat; c.lineWidth = 12; c.beginPath(); c.moveTo(8, -128); c.lineTo(ax, ay); c.stroke();
  c.fillStyle = skin; c.beginPath(); c.arc(ax, ay, 6, 0, TAU); c.fill();
  if (o.lantern) { c.fillStyle = "#3a3030"; c.fillRect(ax - 7, ay + 4, 14, 20); c.globalCompositeOperation = "lighter"; glow(c, ax, ay + 14, 260, "255,180,100", 0.55); glow(c, ax, ay + 14, 30, "255,230,180", 0.9); c.globalCompositeOperation = "source-over"; }
  // 头和马尾（累了会低头）
  const droop = o.tired ? 0.35 + 0.1 * Math.sin(t * 0.8) : 0;
  c.save(); c.translate(0, -156); c.rotate(droop);
  c.fillStyle = skin; c.beginPath(); c.arc(0, 0, 16, 0, TAU); c.fill();
  c.fillStyle = dark; c.beginPath(); c.arc(-2, -4, 17, Math.PI * 0.95, Math.PI * 2.1); c.fill();
  c.beginPath(); c.moveTo(-14, -4); c.quadraticCurveTo(-34 - Math.sin(t * 3) * 6 * (o.wind ?? 0.3), 6, -30, 30); c.lineTo(-22, 26); c.quadraticCurveTo(-24, 6, -10, 2); c.fill();
  c.restore();
  c.restore();
}

// ---------- 镜头 ----------
// 远景：整片海、悬崖和灯塔
function shotWide(c, t, cam = [960, 540, 1]) {
  c.save(); c.translate(W / 2, H / 2); c.scale(cam[2], cam[2]); c.translate(-cam[0], -cam[1]);
  sky(c, t); clouds(c, t); lightning(c, t); sea(c, t, HORIZON);
  lighthouse(c, t);
  // 她站在灯塔平台上；入夜后进了灯室，天亮跑下小路去码头
  if (t < S.storm[0]) keeper(c, LH_X + 44, LAMP_Y + 26, 0.22, t, { pose: "stand", face: 1 });
  const run = ss(S.dawn[0] + 14, S.dawn[0] + 27, t);
  if (t > S.dawn[0] + 14) { const path = [[380, 602], [500, 640], [450, 700], [560, 760], [520, 810], [620, 830]], u = run * (path.length - 1), i = Math.min(path.length - 2, Math.floor(u)), f = u - i; keeper(c, lerp(path[i][0], path[i + 1][0], f), lerp(path[i][1], path[i + 1][1], f), 0.3, t, { pose: run < 1 ? "run" : "stand", face: path[i + 1][0] > path[i][0] ? 1 : -1 }); }
  cliff(c, t);
  const b = boatWide(t), ang = t * 0.9, hit = Math.cos(ang) > 0 && lamp(t) > 0 ? Math.exp(-Math.pow(mod(ang, TAU) - Math.atan2(0, 1), 2) * 30) : 0;
  const ashore = t > S.dawn[0] + 33;
  boat(c, b.x, b.y, b.s, b.tilt, t, { lit: hit, rowing: t > S.beam[0] && !ashore, empty: ashore });
  if (ashore) { fisherman(c, 676, 830, 0.3, t); }
  rain(c, t);
  c.restore();
}
// 近景：风浪里的小船
function shotBoat(c, t) {
  const st = storm(t), hz = 470 + Math.sin(t * 0.9) * 30 * st;
  sky(c, t); clouds(c, t); lightning(c, t, 1300, 300);
  // 远处的灯塔光：亮着的时候在海平线上一闪一闪
  if (lamp(t) > 0) { const f = Math.max(0, Math.sin(t * 0.9)); c.globalCompositeOperation = "lighter"; glow(c, 300, hz - 40, 60 + 400 * f, "255,236,190", lamp(t) * (0.3 + 0.6 * f)); c.globalCompositeOperation = "source-over"; }
  sea(c, t, hz, 2.6);
  const toward = ss(S.beam[0] + 3, S.beam[0] + 6, t);
  boat(c, 1000 + Math.sin(t * 0.7) * 60, 760 + Math.sin(t * 1.6) * (6 + st * 30), 2.2, Math.sin(t * 1.3) * (0.06 + st * 0.32), t, { rowing: t > S.beam[0], lit: lamp(t) * Math.max(0, Math.sin(t * 0.9)) * toward });
  rain(c, t, 1.3);
}
// 近景：从外面看灯室的窗，她在里面
function shotWindow(c, t) {
  sky(c, t); clouds(c, t); sea(c, t, HORIZON);
  c.fillStyle = rgb(mixc([230, 224, 214], [60, 62, 80], night(t))); c.fillRect(560, 0, 800, H);
  c.fillStyle = "#1a1a24"; c.fillRect(700, 200, 520, 560);
  c.fillStyle = `rgba(255,220,160,${0.75 * lamp(t) + 0.2})`; c.fillRect(720, 220, 480, 520);
  c.globalCompositeOperation = "lighter"; glow(c, 960, 480, 500, "255,220,160", 0.35 * (lamp(t) + 0.3)); c.globalCompositeOperation = "source-over";
  keeper(c, 960, 760, 2.2, t, { pose: "stand", face: 1, wind: 0 });
  c.strokeStyle = "#1a1a24"; c.lineWidth = 14; c.beginPath(); c.moveTo(960, 200); c.lineTo(960, 760); c.moveTo(700, 480); c.lineTo(1220, 480); c.stroke();
  rain(c, t, 1.2);
  for (let i = 0; i < 60 * storm(t); i++) { const q = rng(900 + i), x = 720 + q() * 480, y = mod(220 + q() * 520 + t * (20 + q() * 40), 520) + 220; c.fillStyle = "rgba(220,230,255,.4)"; c.beginPath(); c.ellipse(x, y, 4, 6, 0, 0, TAU); c.fill(); }
}
// 灯塔里的旋转楼梯：她提着油灯往上爬
function shotStairs(c, t) {
  const fast = ss(S.climb[0] + 22, S.climb[0] + 26, t) * (1 - ss(S.climb[0] + 34, S.climb[0] + 38, t));
  const climbed = (t - S.climb[0]) * 70 + fast * (t - S.climb[0] - 22) * 50;
  c.fillStyle = "#07060a"; c.fillRect(0, 0, W, H);
  // 圆形砖墙（向下滚动）
  for (let row = -2; row < 24; row++) {
    const y = mod(row * 56 + climbed, 24 * 56) - 112;
    for (let k = 0; k < 16; k++) { const x = (k + (row % 2) * 0.5) * 130 - 60; c.fillStyle = `rgba(70,56,50,${0.55 + 0.1 * ((k + row) % 3)})`; c.fillRect(x, y, 122, 50); }
  }
  // 一级一级的台阶，左右交替盘旋
  for (let i = -2; i < 14; i++) {
    const y = mod(i * 110 + climbed * 1.2, 14 * 110) - 120, side = i % 2 ? 1 : -1, x = 960 + side * 120;
    c.fillStyle = "#5a4842"; c.beginPath(); c.moveTo(x - 220, y); c.lineTo(x + 220, y); c.lineTo(x + 190, y + 26); c.lineTo(x - 190, y + 26); c.fill();
    c.fillStyle = "rgba(255,220,180,.12)"; c.fillRect(x - 220, y, 440, 4);
    c.fillStyle = "rgba(0,0,0,.5)"; c.fillRect(x - 190, y + 26, 380, 40);
  }
  // 窗缝里透进来的闪电
  const f = flash(t);
  if (f > 0.02) { c.fillStyle = `rgba(220,230,255,${0.6 * f})`; c.fillRect(1500, 120, 26, 220); c.globalCompositeOperation = "lighter"; glow(c, 1510, 230, 600, "200,215,255", 0.4 * f); c.globalCompositeOperation = "source-over"; }
  // 黑暗里只有油灯照亮的一圈
  // 她脚下踩着的那一级台阶
  c.fillStyle = "#6a5650"; c.beginPath(); c.moveTo(720, 820); c.lineTo(1200, 820); c.lineTo(1170, 850); c.lineTo(750, 850); c.fill();
  c.fillStyle = "rgba(0,0,0,.5)"; c.fillRect(750, 850, 420, 60);
  const g = c.createRadialGradient(990, 620, 60, 990, 620, 760); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.92)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  keeper(c, 960, 820, 2.4, t, { pose: "climb", lantern: true, face: 1, wind: 0 });
}
// 灯室：巨大的菲涅尔透镜，她点亮备用灯、用手摇动镜片
function shotLamp(c, t, tired = false) {
  const lv = lamp(t), e = E(t);
  c.fillStyle = "#0a0b12"; c.fillRect(0, 0, W, H);
  // 四周的玻璃窗，外面是风雨
  for (let i = 0; i < 4; i++) { c.fillStyle = rgb(mixc([30, 36, 60], [255, 200, 150], dawnP(t)), 0.9); c.fillRect(80 + i * 460, 120, 400, 620); }
  rain(c, t, 1.1);
  c.fillStyle = "#0a0b12"; for (let i = 0; i <= 4; i++) c.fillRect(60 + i * 460, 100, 20, 660);
  // 透镜：一圈圈同心棱镜，随手摇转动
  const rot = (t - RELIGHT) * (tired ? 0.5 : 1.1);
  c.save(); c.translate(1100, 500);
  c.globalCompositeOperation = "lighter";
  glow(c, 0, 0, 520, "255,230,170", lv * (0.45 + 0.35 * e));
  for (let k = 8; k > 0; k--) { c.strokeStyle = `rgba(200,220,255,${0.25 + 0.4 * lv})`; c.lineWidth = 6; c.beginPath(); c.ellipse(0, 0, k * 26, k * 34, 0, 0, TAU); c.stroke(); }
  for (let k = 0; k < 8; k++) { const a = rot + k * TAU / 8; c.strokeStyle = `rgba(255,245,210,${0.15 + 0.5 * lv * Math.max(0, Math.cos(a))})`; c.lineWidth = 10; c.beginPath(); c.moveTo(Math.cos(a) * 40, -230); c.lineTo(Math.cos(a) * 200, 230); c.stroke(); }
  glow(c, 0, 0, 70, "255,250,230", lv);
  c.globalCompositeOperation = "source-over";
  c.restore();
  // 点灯那一下的火光
  const strike = win(t, RELIGHT - 0.3, RELIGHT + 1.2, 0.2);
  if (strike > 0) { c.globalCompositeOperation = "lighter"; glow(c, 1100, 500, 900, "255,200,130", 0.8 * strike); c.globalCompositeOperation = "source-over"; }
  // 手柄和她
  c.strokeStyle = "#5a5050"; c.lineWidth = 10; c.beginPath(); c.moveTo(700, 640); c.lineTo(760, 640); c.stroke();
  const cranking = t > RELIGHT + 0.5;
  keeper(c, 640, 900, 2.6, t, { pose: cranking ? "crank" : "stand", slow: tired, tired, face: 1, wind: 0, lantern: !cranking && t < RELIGHT });
  if (t < RELIGHT) { const g = c.createRadialGradient(700, 640, 80, 700, 640, 900); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.85)"); c.fillStyle = g; c.fillRect(0, 0, W, H); }
}
// 黎明的码头：小船靠岸，她迎上去
function shotDock(c, t) {
  const arrive = ss(S.dawn[0] + 26, S.dawn[0] + 33, t), meet = ss(S.dawn[0] + 31, S.dawn[0] + 35, t);
  sky(c, t); clouds(c, t); sea(c, t, 600, 1.2);
  c.fillStyle = "#4a3428"; c.fillRect(-100, 760, 1250, 26); for (let x = -80; x < 1150; x += 70) c.fillRect(x, 786, 14, 300);
  const bx = lerp(1900, 1320, arrive);
  boat(c, bx, 800 + Math.sin(t * 1.4) * 4, 1.8, Math.sin(t * 1.1) * 0.03, t, { empty: arrive >= 1 });
  // 他跳上码头，两人走近，拥抱
  const hx = lerp(1180, 1030, meet), sx = lerp(300, 950, ss(S.dawn[0] + 27, S.dawn[0] + 34, t));
  keeper(c, sx, 762, 1.9, t, { pose: sx < 940 ? "run" : "stand", face: 1 });
  if (arrive >= 1) fisherman(c, hx, 762, 1.9, t, { reach: meet });
  c.globalCompositeOperation = "lighter"; glow(c, 1300, 420, 700, "255,200,140", 0.3); c.globalCompositeOperation = "source-over";
}

// ---------- 剪辑表：每个镜头的起止时间 ----------
const n0 = S.night[0], s0 = S.storm[0], b0 = S.beam[0], r0 = S.bridge[0], d0 = S.dawn[0];
const CUTS = [
  [0, n0, (c, t) => shotWide(c, t, [lerp(1000, 900, clamp(t / n0)), 560, lerp(1.2, 1.0, clamp(t / n0))])],
  [n0, n0 + 11.6, (c, t) => shotWide(c, t, [760, 500, 1.15])],
  [n0 + 11.6, n0 + 21.4, shotWindow],
  [n0 + 21.4, s0, (c, t) => shotWide(c, t, [1480, 580, 2.2])],
  [s0, s0 + 5.4, (c, t) => shotWide(c, t)], [s0 + 5.4, s0 + 10.8, shotBoat], [s0 + 10.8, s0 + 16.2, (c, t) => shotWide(c, t, [600, 480, 1.25])],
  [s0 + 16.2, s0 + 21.6, shotBoat], [s0 + 21.6, s0 + 27.0, shotWindow], [s0 + 27.0, S.dark[0], shotBoat],
  [S.dark[0], S.climb[0], (c, t) => shotWide(c, t, [700, 480, 1.1])],
  [S.climb[0], RELIGHT - 3, shotStairs],
  [RELIGHT - 3, b0, (c, t) => shotLamp(c, t)],
  [b0, b0 + 5.4, (c, t) => shotWide(c, t)], [b0 + 5.4, b0 + 10.8, shotBoat], [b0 + 10.8, b0 + 16.2, (c, t) => shotLamp(c, t)],
  [b0 + 16.2, b0 + 21.6, (c, t) => shotWide(c, t, [1200, 560, 1.15])], [b0 + 21.6, b0 + 27.0, shotBoat], [b0 + 27.0, r0, (c, t) => shotWide(c, t)],
  [r0, r0 + 7.7, (c, t) => shotWide(c, t, [900, 520, 1.05])], [r0 + 7.7, r0 + 15.2, (c, t) => shotLamp(c, t, true)],
  [r0 + 15.2, r0 + 20.2, shotBoat], [r0 + 20.2, d0, (c, t) => shotWide(c, t, [1100, 540, 1.2])],
  [d0, d0 + 26, (c, t) => shotWide(c, t, [lerp(1000, 920, ss(d0, d0 + 26, t)), 560, lerp(1.2, 1.05, ss(d0, d0 + 26, t))])],
  [d0 + 26, S.outro[0], shotDock],
  [S.outro[0], TL.duration + 1, (c, t) => shotWide(c, t, [lerp(960, 900, ss(S.outro[0], TL.duration, t)), 540, lerp(1.05, 1.0, ss(S.outro[0], TL.duration, t))])],
];
const FADE = 0.35;   // 跟着节拍硬切，只留很短的交叉
const layers = [0, 1].map(() => { const o = document.createElement("canvas"); o.width = W; o.height = H; return o; });
const VIG = (() => { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.3)"); return g; })();

function titleCard(t, a, b, title, sub) {
  const al = win(t, a, b, 1.6);
  if (al <= 0) return;
  ctx.save(); ctx.globalAlpha = al; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff8ee"; ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 24;
  ctx.font = '700 110px "Noto Serif SC", serif'; ctx.letterSpacing = "26px"; ctx.fillText(title, W / 2 + 13, H * 0.36);
  ctx.shadowBlur = 10; ctx.font = '400 26px "Noto Serif SC", serif'; ctx.letterSpacing = "4px"; ctx.fillStyle = "rgba(255,248,238,.9)";
  ctx.fillText(sub, W / 2 + 2, H * 0.36 + 100);
  ctx.restore();
}

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let li = 0;
  for (const [a, b, fn] of CUTS) {
    if (t < a - FADE || t > b + FADE) continue;
    const al = Math.min(ss(a - FADE, a + FADE, t), 1 - ss(b - FADE, b + FADE, t));
    if (al <= 0) continue;
    const L = layers[li++ % 2], c = L.getContext("2d");
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.clearRect(0, 0, W, H);
    fn(c, t);
    ctx.globalAlpha = a <= 0 ? 1 : al; ctx.drawImage(L, 0, 0); ctx.globalAlpha = 1;
  }
  // 闪电时整个画面一白
  const f = flash(t);
  if (f > 0.02) { ctx.fillStyle = `rgba(235,240,255,${0.55 * f})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H);
  titleCard(t, 3, 12, "守灯人", "");
  titleCard(t, S.outro[0] + 3, TL.duration - 0.6, "守灯人", "Music · Dusk Till Dawn — ZAYN ft. Sia　　Story & animation · AI 生成");
  ctx.fillStyle = `rgba(0,0,0,${Math.max(1 - ss(0, 2.5, t), ss(TL.duration - 2.5, TL.duration, t))})`; ctx.fillRect(0, 0, W, H);
}
window.renderAt = renderAt;
window.ready = document.fonts.load('700 110px "Noto Serif SC"').then(() => document.fonts.load('26px "Noto Serif SC"')).then(() => { renderAt(0); return true; });
</script>
