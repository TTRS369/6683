<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>迟写的章节</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// 《迟写的章节》MV：逐帧确定性渲染。段落和逐句歌词时间由渲染脚本通过 window.TIMELINE 注入。
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const TL = window.TIMELINE || { duration: 204, sections: { intro: [0, 18], v1: [18, 38.4], ch1: [38.4, 69.2], inter: [69.2, 81.3], v2: [81.3, 102.7], ch2: [102.7, 131.9], bridge: [131.9, 156.6], outro: [156.6, 204] }, lyrics: [] };
const S = TL.sections, LYRICS = TL.lyrics;
// 包含 sub 的第 nth 句歌词开始唱的时间（按内容找，不按序号，副歌重复的句子用 nth 区分）
const lyricOf = (sub, nth = 0, fb = 0) => { const l = LYRICS.filter(x => x[2].includes(sub))[nth]; return l ? l[0] : fb; };

// ---------- 工具 ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ss = (a, b, t) => { const x = clamp((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, p) => a + (b - a) * p;
const win = (t, a, b, f = 1) => ss(a, a + f, t) * (1 - ss(b - f, b, t));
const mod = (a, n) => ((a % n) + n) % n;
function glow(c, x, y, r, rgb, a) {
  if (r <= 0 || a <= 0) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(0.45, `rgba(${rgb},${a * 0.3})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}
function vgrad(c, x, y, w, h, stops) { const g = c.createLinearGradient(0, y, 0, y + h); stops.forEach(([p, col]) => g.addColorStop(p, col)); c.fillStyle = g; c.fillRect(x, y, w, h); }
function stars(c, t, n, seed, a, x0, y0, w, h) { const r = rng(seed); for (let i = 0; i < n; i++) { const x = x0 + r() * w, y = y0 + r() * h, s = 0.8 + r() * 1.8; c.fillStyle = `rgba(240,240,255,${a * (0.4 + 0.6 * Math.abs(Math.sin(t * (0.5 + r()) + i)))})`; c.fillRect(x, y, s, s); } }

// ---------- 道具 ----------
// 摊开的本子。lines：已写满的行数（可带小数，正在写），broken：断续墨迹的进度，print：指纹亮度
function notebook(c, x, y, w, h, t, o = {}) {
  c.save(); c.translate(x, y);
  c.fillStyle = "rgba(0,0,0,.35)"; c.beginPath(); c.ellipse(0, h * 0.55, w * 0.55, 18, 0, 0, TAU); c.fill();
  for (const side of [-1, 1]) {
    c.fillStyle = o.fresh ? "#f6efdc" : "#e8d6a8";
    c.beginPath(); c.moveTo(0, -h / 2 + 6); c.quadraticCurveTo(side * w * 0.25, -h / 2 - 6, side * w / 2, -h / 2); c.lineTo(side * w / 2, h / 2); c.quadraticCurveTo(side * w * 0.25, h / 2 - 10, 0, h / 2 + 4); c.fill();
    c.strokeStyle = "rgba(120,90,50,.18)"; c.lineWidth = 1;
    for (let i = 1; i < 9; i++) { const ly = -h / 2 + i * h / 9.5; c.beginPath(); c.moveTo(side * 14, ly); c.lineTo(side * (w / 2 - 14), ly); c.stroke(); }
  }
  c.strokeStyle = "rgba(90,60,30,.4)"; c.beginPath(); c.moveTo(0, -h / 2 + 6); c.lineTo(0, h / 2 + 4); c.stroke();
  // 左页：写满的旧字迹
  c.strokeStyle = "rgba(50,35,25,.55)"; c.lineWidth = 2;
  const r = rng(5);
  for (let i = 1; i < 8; i++) { const ly = -h / 2 + i * h / 9.5 - 4; c.beginPath(); c.moveTo(-w / 2 + 18, ly); for (let x = -w / 2 + 18; x < -20; x += 6) c.lineTo(x, ly + Math.sin(x * 0.9 + i) * 2.5); c.stroke(); }
  // 右页：断续的墨迹
  if (o.broken > 0) {
    c.strokeStyle = "rgba(30,20,15,.75)"; c.lineWidth = 2.4;
    for (let i = 1; i < 6; i++) {
      const ly = -h / 2 + i * h / 9.5 - 4, len = clamp(o.broken * 5 - (i - 1)) * (w / 2 - 40);
      c.beginPath(); let pen = false;
      for (let x = 0; x < len; x += 5) { const gap = Math.sin(x * 0.13 + i * 4) > 0.55; if (gap) { pen = false; continue; } const px = 20 + x, py = ly + Math.sin(x * 0.8 + i) * 2.5; pen ? c.lineTo(px, py) : c.moveTo(px, py); pen = true; }
      c.stroke();
    }
  }
  // 右页：新写下的整行字
  if (o.lines > 0) {
    c.strokeStyle = "rgba(30,20,15,.8)"; c.lineWidth = 2.4;
    for (let i = 1; i <= Math.ceil(o.lines); i++) {
      const ly = -h / 2 + i * h / 9.5 - 4, len = clamp(o.lines - (i - 1)) * (w / 2 - 40);
      c.beginPath(); c.moveTo(20, ly); for (let x = 0; x < len; x += 5) c.lineTo(20 + x, ly + Math.sin(x * 0.8 + i * 2) * 2.5); c.stroke();
    }
  }
  if (o.text) {
    c.fillStyle = `rgba(40,28,20,${o.textA ?? 1})`; c.font = 'italic 400 30px "Noto Serif SC", serif'; c.textAlign = "left"; c.textBaseline = "middle";
    c.fillText(o.text, 30, h / 2 - 40);
  }
  if (o.print > 0) {
    c.globalCompositeOperation = "lighter"; glow(c, w / 2 - 60, h / 2 - 46, 60, "255,190,120", 0.5 * o.print); c.globalCompositeOperation = "source-over";
    c.strokeStyle = `rgba(170,80,50,${0.75 * o.print})`; c.lineWidth = 1.6;
    for (let k = 0; k < 7; k++) { c.beginPath(); c.ellipse(w / 2 - 60, h / 2 - 46, 6 + k * 3.2, 9 + k * 3.6, 0.2, 0.3, TAU - 0.2); c.stroke(); }
  }
  c.restore();
}
function paper(c, x, y, rot, s, a, col = "#efe2bd") {
  c.save(); c.translate(x, y); c.rotate(rot); c.globalAlpha *= a;
  c.fillStyle = col; c.fillRect(-26 * s, -34 * s, 52 * s, 68 * s);
  c.strokeStyle = "rgba(120,90,50,.3)"; c.lineWidth = 1; for (let i = 1; i < 6; i++) { c.beginPath(); c.moveTo(-20 * s, -34 * s + i * 11 * s); c.lineTo(20 * s, -34 * s + i * 11 * s); c.stroke(); }
  c.restore();
}
function envelope(c, x, y, rot, s, glowA = 0) {
  c.save(); c.translate(x, y); c.rotate(rot);
  if (glowA > 0) { c.globalCompositeOperation = "lighter"; glow(c, 0, 0, 120 * s, "255,200,130", 0.5 * glowA); c.globalCompositeOperation = "source-over"; }
  c.fillStyle = "#e9dcc0"; c.fillRect(-48 * s, -30 * s, 96 * s, 60 * s);
  c.strokeStyle = "rgba(120,90,60,.5)"; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-48 * s, -30 * s); c.lineTo(0, 6 * s); c.lineTo(48 * s, -30 * s); c.stroke();
  c.fillStyle = "#9a2a2a"; c.beginPath(); c.arc(0, 6 * s, 8 * s, 0, TAU); c.fill();
  c.restore();
}
function candle(c, x, y, t, s = 1, wind = 0) {
  c.fillStyle = "#efe4cc"; c.fillRect(x - 9 * s, y - 60 * s, 18 * s, 60 * s);
  c.fillStyle = "#3a2a20"; c.fillRect(x - 1, y - 66 * s, 2, 7 * s);
  const fl = 1 + 0.12 * Math.sin(t * 13) + 0.08 * Math.sin(t * 29), lean = wind * Math.sin(t * 3) * 6 + Math.sin(t * 7) * 1.5;
  c.globalCompositeOperation = "lighter";
  glow(c, x + lean, y - 80 * s, 260 * s * fl, "255,170,90", 0.35);
  c.fillStyle = "rgba(255,210,120,.95)"; c.beginPath(); c.moveTo(x - 6 * s, y - 68 * s); c.quadraticCurveTo(x + lean, y - 100 * s * fl, x + 6 * s, y - 68 * s); c.quadraticCurveTo(x, y - 62 * s, x - 6 * s, y - 68 * s); c.fill();
  c.globalCompositeOperation = "source-over";
}
// 站立的人影（背对镜头）
function figurePath(c, x, y, s) {
  c.beginPath();
  c.arc(x, y - 168 * s, 17 * s, 0, TAU);
  c.moveTo(x - 30 * s, y - 145 * s); c.quadraticCurveTo(x, y - 156 * s, x + 30 * s, y - 145 * s);
  c.lineTo(x + 34 * s, y - 60 * s); c.lineTo(x + 20 * s, y - 60 * s); c.lineTo(x + 18 * s, y); c.lineTo(x + 3 * s, y); c.lineTo(x, y - 55 * s);
  c.lineTo(x - 3 * s, y); c.lineTo(x - 18 * s, y); c.lineTo(x - 20 * s, y - 60 * s); c.lineTo(x - 34 * s, y - 60 * s); c.closePath();
}
function windowView(c, x, y, w, h, sky, t, o = {}) {
  c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
  vgrad(c, x, y, w, h, sky);
  if (o.stars) stars(c, t, 90, 9, o.stars, x, y, w, h * 0.6);
  if (o.moon) { c.fillStyle = "#f5efd8"; c.beginPath(); c.arc(x + w * 0.72, y + h * 0.22, 34, 0, TAU); c.fill(); c.globalCompositeOperation = "lighter"; glow(c, x + w * 0.72, y + h * 0.22, 150, "220,230,255", 0.3); c.globalCompositeOperation = "source-over"; }
  if (o.sun) { c.globalCompositeOperation = "lighter"; glow(c, x + w * 0.6, y + h * 0.45, 300, "255,230,170", 0.6 * o.sun); c.globalCompositeOperation = "source-over"; }
  c.fillStyle = o.roof || "#3a2838";
  const r = rng(3);
  for (let i = 0; i < 9; i++) { const bx = x + i * w / 8 - 20, bh = 60 + r() * 120; c.beginPath(); c.moveTo(bx, y + h); c.lineTo(bx, y + h - bh); c.lineTo(bx + w / 16, y + h - bh - 30); c.lineTo(bx + w / 8, y + h - bh); c.lineTo(bx + w / 8, y + h); c.fill(); }
  c.restore();
}

// ---------- 场景 1：黄昏的阁楼书房（前奏 + 主歌 1） ----------
function study(c, t, mode) {
  const dawn = mode === "dawn";
  const po = clamp((t - S.outro[0]) / (S.outro[1] - S.outro[0]));
  const clear = dawn ? ss(lyricOf("落笔是晴空"), lyricOf("落笔是晴空") + 5, t) : 0;
  // 墙
  vgrad(c, 0, 0, W, H, dawn ? [[0, `rgb(${lerp(70, 120, clear) | 0},${lerp(60, 100, clear) | 0},${lerp(70, 90, clear) | 0})`], [1, "#2a1e1a"]] : [[0, "#3a2a2c"], [1, "#22181a"]]);
  c.fillStyle = "rgba(255,255,255,.025)"; for (let x = 0; x < W; x += 60) c.fillRect(x, 0, 24, 780);
  // 斜顶
  c.fillStyle = "#1c1214"; c.beginPath(); c.moveTo(0, 0); c.lineTo(W, 0); c.lineTo(W, 120); c.lineTo(0, 30); c.fill();
  // 窗户
  const wx = 1240, wy = 170, ww = 440, wh = 460;
  const sky = dawn ? [[0, `rgb(${lerp(250, 110, clear) | 0},${lerp(180, 180, clear) | 0},${lerp(140, 240, clear) | 0})`], [1, `rgb(${lerp(255, 200, clear) | 0},${lerp(220, 235, clear) | 0},${lerp(180, 250, clear) | 0})`]] : [[0, "#5a3a6a"], [0.55, "#e0805a"], [1, "#f8c080"]];
  windowView(c, wx, wy, ww, wh, sky, t, { sun: dawn ? 0.6 + clear * 0.4 : 0.5, roof: dawn ? `rgba(80,70,90,${1 - clear * 0.5})` : "#3a2838" });
  // 窗扇：尾声里被推开
  const open = dawn ? ss(lyricOf("落笔是晴空") - 1, lyricOf("落笔是晴空") + 2.5, t) : 0;
  c.fillStyle = "#2a1a16";
  c.fillRect(wx - 16, wy - 16, ww + 32, 16); c.fillRect(wx - 16, wy + wh, ww + 32, 22); c.fillRect(wx - 16, wy, 16, wh); c.fillRect(wx + ww, wy, 16, wh);
  for (const side of [0, 1]) {
    const hinge = side ? wx + ww : wx, sw = ww / 2 * (1 - open * 0.85), x0 = side ? hinge - sw : hinge;
    c.strokeStyle = "#2a1a16"; c.lineWidth = 12; c.strokeRect(x0 + 6, wy + 6, sw - 12, wh - 12);
    c.lineWidth = 6; c.beginPath(); c.moveTo(x0 + sw / 2, wy); c.lineTo(x0 + sw / 2, wy + wh); c.moveTo(x0, wy + wh / 2); c.lineTo(x0 + sw, wy + wh / 2); c.stroke();
    c.fillStyle = `rgba(255,230,190,${0.06 * (1 - open)})`; c.fillRect(x0, wy, sw, wh);
  }
  // 光束与灰尘
  c.globalCompositeOperation = "lighter";
  const beamA = dawn ? 0.12 + 0.12 * clear : 0.1;
  const g = c.createLinearGradient(wx, wy, 600, 900); g.addColorStop(0, `rgba(255,210,150,${beamA})`); g.addColorStop(1, "rgba(255,210,150,0)");
  c.fillStyle = g; c.beginPath(); c.moveTo(wx, wy); c.lineTo(wx + ww, wy + wh * 0.2); c.lineTo(1000, 1000); c.lineTo(280, 1000); c.fill();
  for (let i = 0; i < 70; i++) { const q = rng(100 + i), x = 400 + q() * 1000 + Math.sin(t * 0.3 + i) * 30, y = 250 + q() * 650 + Math.cos(t * 0.25 + i) * 20; c.fillStyle = `rgba(255,230,190,${0.25 + q() * 0.3})`; c.fillRect(x, y, 2, 2); }
  c.globalCompositeOperation = "source-over";
  // 书架和唱片机
  c.fillStyle = "#2c1c18"; c.fillRect(220, 380, 420, 16); c.fillRect(220, 560, 420, 16);
  const br = rng(8); for (let i = 0; i < 9; i++) { c.fillStyle = ["#6a3a2a", "#4a5a4a", "#7a6a4a", "#3a3a5a"][i % 4]; c.fillRect(380 + i * 28, 560 - 70 - br() * 40, 22, 70 + br() * 40); }
  c.fillStyle = "#5a3a28"; c.fillRect(250, 330, 150, 50);
  const spin = t * (t > lyricOf("老唱片") - 0.5 ? 3 : 0.3);
  c.fillStyle = "#111"; c.beginPath(); c.ellipse(320, 328, 58, 14, 0, 0, TAU); c.fill();
  c.strokeStyle = "rgba(255,255,255,.18)"; c.lineWidth = 1; for (let k = 1; k < 5; k++) { c.beginPath(); c.ellipse(320, 328, 12 * k, 3 * k, 0, spin, spin + 2); c.stroke(); }
  c.fillStyle = "#b03a2a"; c.beginPath(); c.ellipse(320, 328, 10, 3, 0, 0, TAU); c.fill();
  c.strokeStyle = "#c9a46a"; c.lineWidth = 3; c.beginPath(); c.moveTo(390, 300); c.lineTo(360, 322); c.stroke();
  // 唱片低语：音符飘起
  if (!dawn) {
    const a = win(t, lyricOf("老唱片") - 0.5, lyricOf("钟声"), 1);
    for (let i = 0; i < 10; i++) { const u = mod(t * 0.25 + i / 10, 1), x = 320 + Math.sin(u * 6 + i) * 40 + u * 120, y = 300 - u * 260; c.fillStyle = `rgba(255,220,160,${a * (1 - u)})`; c.font = '30px serif'; c.fillText(i % 2 ? "♪" : "♫", x, y); }
  }
  // 墙上的镜子：主歌第四句时出现裂痕和碎掉的倒影
  const mirA = dawn ? 0 : ss(lyricOf("唤不起") - 0.5, lyricOf("唤不起") + 1, t);
  c.save(); c.translate(800, 330);
  c.fillStyle = "#3a2a1c"; c.beginPath(); c.ellipse(0, 0, 92, 122, 0, 0, TAU); c.fill();
  c.fillStyle = "#4a5a6a"; c.beginPath(); c.ellipse(0, 0, 78, 108, 0, 0, TAU); c.fill();
  c.save(); c.beginPath(); c.ellipse(0, 0, 78, 108, 0, 0, TAU); c.clip();
  // 倒影：一个人的上半身，裂开后被错开
  for (let k = 0; k < 4; k++) {
    const dx = mirA * [-10, 8, -5, 12][k], dy = mirA * [4, -6, 7, -3][k];
    c.save(); c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 140, k * Math.PI / 2 + 0.3, (k + 1) * Math.PI / 2 + 0.3); c.closePath(); c.clip();
    c.fillStyle = "rgba(20,24,34,.85)"; c.beginPath(); c.arc(dx, -20 + dy, 26, 0, TAU); c.fill(); c.beginPath(); c.ellipse(dx, 70 + dy, 52, 50, 0, Math.PI, 0); c.fill();
    c.restore();
  }
  c.strokeStyle = `rgba(230,240,255,${0.8 * mirA})`; c.lineWidth = 2;
  for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2 + 0.3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * 60 + Math.sin(k) * 10, Math.sin(a) * 80); c.lineTo(Math.cos(a) * 130, Math.sin(a) * 130); c.stroke(); }
  c.restore(); c.restore();
  // 书桌
  c.fillStyle = "#4a2e20"; c.fillRect(240, 760, 900, 26); c.fillStyle = "#3a2418"; c.fillRect(270, 786, 26, 300); c.fillRect(1080, 786, 26, 300);
  c.fillStyle = "#1a1210"; c.fillRect(0, 900, W, H - 900);
  // 墨水瓶和羽毛笔
  c.fillStyle = "#1a1c2a"; c.beginPath(); c.roundRect(980, 715, 50, 46, 8); c.fill();
  c.strokeStyle = "#e8e0d0"; c.lineWidth = 3; c.beginPath(); c.moveTo(1004, 720); c.quadraticCurveTo(1040, 640, 1080, 600); c.stroke();
  c.fillStyle = "rgba(240,235,225,.9)"; c.beginPath(); c.moveTo(1080, 600); c.quadraticCurveTo(1050, 630, 1030, 670); c.quadraticCurveTo(1065, 640, 1080, 600); c.fill();
  // 本子
  const broken = dawn ? 1 : ss(lyricOf("断句"), lyricOf("老唱片"), t);
  const lines = dawn ? 4 * ss(lyricOf("终于被读懂") + 0.5, lyricOf("指纹"), t) : 0;
  const print = dawn ? ss(lyricOf("指纹"), lyricOf("指纹") + 3, t) : 0;
  notebook(c, 640, 700, 520, 150, t, { broken: dawn ? 0 : broken, lines, print, fresh: dawn });
  // 主歌第一句：纸页被风吹散，飘向窗口
  if (!dawn) {
    const t0 = lyricOf("泛黄的纸页散落");
    for (let i = 0; i < 9; i++) {
      const q = rng(200 + i), st = t0 - 0.5 + i * 0.45, p = clamp((t - st) / 7);
      if (p <= 0) continue;
      const x = lerp(640 + (q() - 0.5) * 200, 1300 + q() * 500, p) + Math.sin(p * 9 + i) * 60, y = lerp(690, 120 + q() * 300, p) - Math.sin(p * Math.PI) * 220;
      paper(c, x, y, p * (4 + q() * 4) * (i % 2 ? 1 : -1), 1.2, 1 - ss(0.8, 1, p));
    }
  }
  // 尾声：纸页化成白鸟，从窗口飞向晴空
  if (dawn) {
    const t0 = lyricOf("别让光");
    for (let i = 0; i < 14; i++) {
      const q = rng(300 + i), st = t0 + i * 0.6, p = clamp((t - st) / 8);
      if (p <= 0) continue;
      const x = lerp(640 + (q() - 0.5) * 240, 1500 + q() * 600, p), y = lerp(680, 80 + q() * 200, p) - Math.sin(p * Math.PI) * 150;
      if (p < 0.25) paper(c, x, y, p * 10, 1.1, 1);
      else {
        const fl = Math.sin(t * 10 + i) * 14, s = lerp(1.4, 0.6, p);
        c.strokeStyle = `rgba(255,255,255,${1 - ss(0.85, 1, p)})`; c.lineWidth = 4 * s; c.lineCap = "round";
        c.beginPath(); c.moveTo(x - 26 * s, y - fl * s); c.quadraticCurveTo(x - 10 * s, y - 4 * s, x, y); c.quadraticCurveTo(x + 10 * s, y - 4 * s, x + 26 * s, y - fl * s); c.stroke();
      }
    }
  }
  // 片头 / 片尾
  if (!dawn) titleCard(c, t, 3, S.intro[1] - 0.5, "迟写的章节", "The Chapter Left Unwritten");
  else titleCard(c, t, lyricOf("勇敢爱吧", 1) + 7, TL.duration - 0.8, "迟写的章节", "歌曲：乙白 · Suno.cn　　动画：Claude", true);
}

// ---------- 场景 2：窗外的钟楼（副歌；第二次是夜晚） ----------
function bell(c, t, night) {
  const n = night ? 1 : 0;   // 第几遍副歌
  vgrad(c, 0, 0, W, H, night ? [[0, "#0a0e22"], [0.6, "#1e2448"], [1, "#2a2a4a"]] : [[0, "#4a3060"], [0.5, "#d47a5a"], [1, "#f5b878"]]);
  if (night) { stars(c, t, 260, 21, 0.8, 0, 0, W, H * 0.6); c.fillStyle = "#f5efd8"; c.beginPath(); c.arc(1500, 200, 60, 0, TAU); c.fill(); c.globalCompositeOperation = "lighter"; glow(c, 1500, 200, 280, "220,230,255", 0.3); c.globalCompositeOperation = "source-over"; }
  else { c.globalCompositeOperation = "lighter"; glow(c, 1450, 700, 500, "255,190,120", 0.5); c.globalCompositeOperation = "source-over"; }
  // 远处屋顶
  const roof = night ? "#141630" : "#5a3048";
  c.fillStyle = roof; const r = rng(31);
  for (let i = 0; i < 16; i++) { const bx = i * 130 - 30, bh = 160 + r() * 200; c.beginPath(); c.moveTo(bx, H); c.lineTo(bx, H - bh); c.lineTo(bx + 65, H - bh - 50); c.lineTo(bx + 130, H - bh); c.lineTo(bx + 130, H); c.fill(); }
  // 钟楼
  const tx = 960, col = night ? "#0e1026" : "#3a2034";
  c.fillStyle = col; c.fillRect(tx - 90, 330, 180, 750); c.beginPath(); c.moveTo(tx - 110, 330); c.lineTo(tx, 150); c.lineTo(tx + 110, 330); c.fill();
  c.fillStyle = night ? "#e8e0c8" : "#f0d8b0"; c.beginPath(); c.arc(tx, 480, 62, 0, TAU); c.fill();
  c.strokeStyle = col; c.lineWidth = 6; const hh = t * 0.02, mm = t * 0.24;
  c.beginPath(); c.moveTo(tx, 480); c.lineTo(tx + Math.sin(hh) * 32, 480 - Math.cos(hh) * 32); c.moveTo(tx, 480); c.lineTo(tx + Math.sin(mm) * 50, 480 - Math.cos(mm) * 50); c.stroke();
  // 钟在摆，但敲不响：波纹刚冒出来就散了
  c.fillStyle = night ? "#2a2a40" : "#5a3a40"; c.fillRect(tx - 50, 340, 100, 90);
  const sw = Math.sin(t * 2.2) * 0.35;
  c.save(); c.translate(tx, 345); c.rotate(sw); c.fillStyle = "#b8903a"; c.beginPath(); c.moveTo(-26, 60); c.quadraticCurveTo(-24, 10, 0, 6); c.quadraticCurveTo(24, 10, 26, 60); c.closePath(); c.fill(); c.restore();
  const ringP = mod(t * 2.2 / Math.PI, 1);
  c.strokeStyle = `rgba(255,230,180,${0.4 * (1 - ringP) * win(t, lyricOf("钟声", n), lyricOf("褪色", n), 0.5)})`; c.lineWidth = 2;
  for (let k = 0; k < 3; k++) { c.beginPath(); c.arc(tx, 390, 70 + ringP * 60 + k * 18, Math.PI * 1.1, Math.PI * 1.9); c.stroke(); }
  // 褪色的花瓣在风里飘
  const petA = ss(lyricOf("褪色", n) - 1, lyricOf("褪色", n) + 1, t);
  for (let i = 0; i < 60; i++) {
    const q = rng(400 + i), x = mod(q() * W * 1.3 - t * (60 + q() * 80) * (night ? 1.4 : 1), W + 100) - 50, y = q() * H * 0.8 + Math.sin(t * 1.3 + i) * 40;
    c.save(); c.translate(x, y); c.rotate(t * (1 + q()) + i); c.fillStyle = `rgba(${night ? "200,190,220" : "230,190,190"},${(0.3 + q() * 0.4) * petA})`; c.beginPath(); c.ellipse(0, 0, 9, 5, 0, 0, TAU); c.fill(); c.restore();
  }
  // 前景窗框与窗台
  c.fillStyle = "#1a1010"; c.fillRect(0, 0, W, 50); c.fillRect(0, 0, 70, H); c.fillRect(W - 70, 0, 70, H); c.fillRect(940, 0, 40, 780);
  c.fillStyle = "#2a1a14"; c.fillRect(0, 780, W, H - 780); c.fillStyle = "#3a2418"; c.fillRect(0, 770, W, 22);
  // 窗台上的本子：写着"未完待续"
  const writeA = ss(lyricOf("未完待续", n), lyricOf("未完待续", n) + 2, t);
  notebook(c, 560, 880, 440, 120, t, { broken: 1, text: "未完待续……", textA: writeA });
  // 一封信："我愿意"时微微发光
  const letterA = ss(lyricOf("等一句迟到", n * 2) - 0.5, lyricOf("等一句迟到", n * 2) + 1.5, t);
  envelope(c, 1380, 870, -0.08, 1.4, letterA * (0.7 + 0.3 * Math.sin(t * 2)));
  if (night) candle(c, 1640, 900, t, 1.1);
}

// ---------- 场景 3：雨（间奏） ----------
function rain(c, t) {
  const p = clamp((t - S.inter[0]) / (S.inter[1] - S.inter[0]));
  vgrad(c, 0, 0, W, H, [[0, `rgb(${lerp(80, 20, p) | 0},${lerp(60, 24, p) | 0},${lerp(90, 50, p) | 0})`], [1, `rgb(${lerp(150, 40, p) | 0},${lerp(110, 40, p) | 0},${lerp(110, 70, p) | 0})`]]);
  c.fillStyle = "#1a1424"; const r = rng(41);
  for (let i = 0; i < 16; i++) { const bx = i * 130 - 30, bh = 160 + r() * 220; c.fillRect(bx, H - bh, 120, bh); for (let wy = H - bh + 30; wy < H - 30; wy += 46) for (let wx = bx + 14; wx < bx + 110; wx += 34) if (r() < 0.25) { c.fillStyle = `rgba(255,200,120,${0.4 * p})`; c.fillRect(wx, wy, 14, 20); c.fillStyle = "#1a1424"; } }
  c.strokeStyle = "rgba(200,210,240,.35)"; c.lineWidth = 1.5;
  for (let i = 0; i < 260; i++) { const q = rng(500 + i), x = mod(q() * W + t * 120, W), y = mod(q() * H + t * (900 + q() * 300), H); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 8, y + 26); c.stroke(); }
  // 玻璃上的水珠
  for (let i = 0; i < 50; i++) { const q = rng(600 + i), x = q() * W, y = mod(q() * H + t * (20 + q() * 40), H); c.fillStyle = "rgba(220,230,255,.25)"; c.beginPath(); c.ellipse(x, y, 4, 6, 0, 0, TAU); c.fill(); }
  c.fillStyle = "#120c0c"; c.fillRect(0, 0, W, 44); c.fillRect(0, 0, 60, H); c.fillRect(W - 60, 0, 60, H); c.fillRect(940, 0, 40, H); c.fillRect(0, 520, W, 30); c.fillRect(0, 1036, W, 44);
}

// ---------- 场景 4：走廊（主歌 2） ----------
function hall(c, t) {
  const vx = 960, vy = 470;
  vgrad(c, 0, 0, W, H, [[0, "#1a1418"], [1, "#0c0a0c"]]);
  // 尽头的门和光：靠近又抽离
  const l2 = lyricOf("光曾"), near = ss(l2 - 0.5, l2 + 2, t) * (1 - ss(l2 + 2.5, l2 + 4.5, t));
  const dw = lerp(70, 160, near), dh = lerp(150, 320, near);
  c.globalCompositeOperation = "lighter"; glow(c, vx, vy + 20, 260 + near * 500, "255,210,150", 0.35 + near * 0.35); c.globalCompositeOperation = "source-over";
  c.fillStyle = `rgb(255,${220 + near * 20 | 0},${170 + near * 40 | 0})`; c.fillRect(vx - dw / 2, vy - dh / 2 + 40, dw, dh);
  // 透视的墙、地板、天花板
  const P = (x, y, k) => [vx + (x - vx) * k, vy + (y - vy) * k];
  c.fillStyle = "#2a1e1c"; c.beginPath(); c.moveTo(0, 0); c.lineTo(...P(0, 0, 0.12)); c.lineTo(...P(0, H, 0.12)); c.lineTo(0, H); c.fill();
  c.fillStyle = "#24191a"; c.beginPath(); c.moveTo(W, 0); c.lineTo(...P(W, 0, 0.12)); c.lineTo(...P(W, H, 0.12)); c.lineTo(W, H); c.fill();
  c.fillStyle = "#1c1412"; c.beginPath(); c.moveTo(0, H); c.lineTo(...P(0, H, 0.12)); c.lineTo(...P(W, H, 0.12)); c.lineTo(W, H); c.fill();
  c.fillStyle = "#140e0e"; c.beginPath(); c.moveTo(0, 0); c.lineTo(...P(0, 0, 0.12)); c.lineTo(...P(W, 0, 0.12)); c.lineTo(W, 0); c.fill();
  c.strokeStyle = "rgba(255,220,170,.06)"; c.lineWidth = 2;
  for (let i = 1; i < 12; i++) { const x = i * W / 12; c.beginPath(); c.moveTo(x, H); c.lineTo(...P(x, H, 0.12)); c.stroke(); }
  // 两侧的门
  for (let i = 0; i < 4; i++) {
    const k1 = [0.85, 0.55, 0.36, 0.23][i], k2 = k1 * 0.78;
    for (const side of [0, W]) {
      const [x1, y1] = P(side, 220, k1), [x2, y2] = P(side, 220, k2), [, y3] = P(side, H - 60, k1), [, y4] = P(side, H - 60, k2);
      c.fillStyle = "#3a2622"; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.lineTo(x2, y4); c.lineTo(x1, y3); c.fill();
    }
  }
  // 墙上的剪影：被灯光拉长的人影
  const a1 = win(t, lyricOf("走廊") - 0.5, lyricOf("光曾") + 1, 1);
  c.save(); c.globalAlpha = 0.5 * a1; c.fillStyle = "#0a0606"; c.translate(1420, 760); c.transform(1, 0, -0.5, 1, 0, 0); figurePath(c, 0, 0, 2.2); c.fill(); c.restore();
  // 地上没寄出的信
  for (let i = 0; i < 9; i++) { const q = rng(700 + i), a = ss(lyricOf("走廊") + i * 0.3, lyricOf("走廊") + i * 0.3 + 0.8, t); c.save(); c.globalAlpha = a; envelope(c, 300 + q() * 1300, 790 + q() * 90, (q() - 0.5) * 0.8, 0.8 + q() * 0.35); c.restore(); }
  // 倒转的时钟
  const cx = 380, cy = 330, back = (t - lyricOf("倒转")) * -3 * ss(lyricOf("倒转") - 0.5, lyricOf("倒转"), t);
  c.fillStyle = "#4a3424"; c.beginPath(); c.arc(cx, cy, 82, 0, TAU); c.fill();
  c.fillStyle = "#e8dcc0"; c.beginPath(); c.arc(cx, cy, 70, 0, TAU); c.fill();
  c.strokeStyle = "#2a1a14"; c.lineWidth = 3; for (let k = 0; k < 12; k++) { const a = k * TAU / 12; c.beginPath(); c.moveTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60); c.lineTo(cx + Math.cos(a) * 68, cy + Math.sin(a) * 68); c.stroke(); }
  c.lineWidth = 5; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.sin(back / 12) * 36, cy - Math.cos(back / 12) * 36); c.stroke();
  c.lineWidth = 3; c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.sin(back) * 56, cy - Math.cos(back) * 56); c.stroke();
  // 尽头那个人的背影，被一道光一点点描出来
  const fA = ss(lyricOf("描摹") - 1, lyricOf("描摹") + 0.5, t), trace = ss(lyricOf("描摹"), lyricOf("描摹") + 4.5, t);
  if (fA > 0) {
    c.save(); c.globalAlpha = fA; figurePath(c, vx, vy + 40 + dh / 2, 1.25); c.fillStyle = "#120a08"; c.fill();
    c.setLineDash([2000 * trace, 4000]); c.strokeStyle = "rgba(255,220,160,.95)"; c.lineWidth = 2.5; c.shadowColor = "rgba(255,200,140,.9)"; c.shadowBlur = 10; c.stroke();
    c.restore();
  }
}

// ---------- 场景 5：空荡的楼梯与烛火（桥段） ----------
function stair(c, t) {
  vgrad(c, 0, 0, W, H, [[0, "#0a0a12"], [1, "#16121a"]]);
  // 高窗与雨
  c.fillStyle = "#1a2030"; c.fillRect(1380, 120, 220, 460);
  c.strokeStyle = "rgba(180,200,240,.35)"; c.lineWidth = 1.5;
  c.save(); c.beginPath(); c.rect(1380, 120, 220, 460); c.clip();
  for (let i = 0; i < 70; i++) { const q = rng(800 + i), x = 1380 + mod(q() * 220 + t * 40, 220), y = 120 + mod(q() * 460 + t * 700, 460); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 4, y + 20); c.stroke(); }
  c.restore();
  c.strokeStyle = "#0a0a10"; c.lineWidth = 10; c.strokeRect(1380, 120, 220, 460); c.beginPath(); c.moveTo(1490, 120); c.lineTo(1490, 580); c.stroke();
  // 旋转楼梯
  for (let i = 0; i < 16; i++) {
    const a = i * 0.42 - 1.2, y = 980 - i * 52, x = 860 + Math.sin(a) * 360, w2 = 200 + Math.cos(a) * 80;
    c.fillStyle = `rgb(${40 + i * 2},${30 + i * 2},${34 + i * 2})`; c.fillRect(x - w2 / 2, y, w2, 20);
    c.fillStyle = "rgba(0,0,0,.4)"; c.fillRect(x - w2 / 2, y + 20, w2, 30);
  }
  c.strokeStyle = "#2a2028"; c.lineWidth = 6; c.beginPath(); for (let i = 0; i <= 15; i++) { const a = i * 0.42 - 1.2; c.lineTo(860 + Math.sin(a) * 360 + 110, 920 - i * 52); } c.stroke();
  // 烛火映出墙上的旧相框
  const marks = ss(lyricOf("烛火") - 0.5, lyricOf("烛火") + 2.5, t);
  for (let i = 0; i < 5; i++) { const q = rng(900 + i), x = 260 + i * 170 + q() * 40, y = 260 + q() * 200, w2 = 70 + q() * 50; c.strokeStyle = `rgba(200,160,110,${0.5 * marks})`; c.lineWidth = 4; c.strokeRect(x, y, w2, w2 * 1.3); c.fillStyle = `rgba(120,90,70,${0.25 * marks})`; c.fillRect(x + 6, y + 6, w2 - 12, w2 * 1.3 - 12); }
  // 有人用沉默挡下了风雨：一个身影弯腰护住烛火
  const guard = ss(lyricOf("别怕") - 0.5, lyricOf("别怕") + 3, t), shield = ss(lyricOf("挡下") - 1, lyricOf("挡下") + 1, t);
  const fx = 760, fy = 900;
  candle(c, 900, 902, t, 1.4, 1 - shield);
  if (shield > 0) {
    // 风雨打在披风上被挡开
    for (let i = 0; i < 40; i++) { const q = rng(950 + i), u = mod(t * 1.2 + q(), 1), x = lerp(1300, 950, u), y = lerp(300 + q() * 300, 700 + q() * 100, u); c.strokeStyle = `rgba(180,200,240,${0.5 * shield * (1 - u)})`; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 18, y + 10); c.stroke(); }
  }
  if (guard > 0) {
    c.save(); c.globalAlpha = guard; c.fillStyle = "#06050a";
    c.beginPath(); c.arc(fx + 40, fy - 220, 26, 0, TAU); c.fill();
    c.beginPath(); c.moveTo(fx - 20, fy - 200); c.quadraticCurveTo(fx + 120, fy - 240, fx + 230, fy - 120 * (0.6 + 0.4 * shield)); c.quadraticCurveTo(fx + 160, fy - 40, fx + 120, fy); c.lineTo(fx - 40, fy); c.quadraticCurveTo(fx - 60, fy - 120, fx - 20, fy - 200); c.fill();
    c.strokeStyle = `rgba(255,190,120,${0.5 * shield})`; c.lineWidth = 2; c.stroke();
    c.restore();
  }
}

// ---------- 片头片尾 ----------
function titleCard(c, t, a, b, title, sub, dark = false) {
  const al = win(t, a, b, 1.6);
  if (al <= 0) return;
  c.save(); c.globalAlpha = al; c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = dark ? "rgba(255,246,230,.6)" : "rgba(10,6,8,.35)"; c.fillRect(0, H * 0.3, W, 260);
  c.font = '700 110px "Noto Serif SC", serif'; c.letterSpacing = "18px";
  c.fillStyle = dark ? "#3a2a30" : "#f6ead6"; c.shadowColor = dark ? "rgba(255,255,255,.85)" : "rgba(255,190,120,.55)"; c.shadowBlur = 28;
  c.fillText(title, W / 2 + 9, H * 0.38);
  c.shadowBlur = 0; c.font = '400 30px "Noto Serif SC", serif'; c.letterSpacing = "6px";
  c.fillStyle = dark ? "rgba(58,42,48,.9)" : "rgba(246,234,214,.85)";
  c.fillText(sub, W / 2 + 3, H * 0.38 + 100);
  c.restore();
}

// ---------- 编排 ----------
const SCENES = [
  [c => (t => study(c, t, "dusk")), 0, S.ch1[0]],
  [c => (t => bell(c, t, false)), S.ch1[0], S.inter[0]],
  [c => (t => rain(c, t)), S.inter[0], S.v2[0]],
  [c => (t => hall(c, t)), S.v2[0], S.ch2[0]],
  [c => (t => bell(c, t, true)), S.ch2[0], S.bridge[0]],
  [c => (t => stair(c, t)), S.bridge[0], S.outro[0]],
  [c => (t => study(c, t, "dawn")), S.outro[0], TL.duration + 1],
];
const FADE = 1.2;
const layers = [0, 1].map(() => { const o = document.createElement("canvas"); o.width = W; o.height = H; return o; });
const LYRIC_BG = (() => { const g = ctx.createLinearGradient(0, H - 230, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.45)"); return g; })();
const VIG = (() => { const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.5)"); return g; })();

function drawLyrics(t) {
  ctx.fillStyle = LYRIC_BG; ctx.fillRect(0, H - 230, W, 230);
  for (const [a, b, txt] of LYRICS) {
    if (t < a - 0.4 || t > b + 0.4) continue;
    const echo = txt.startsWith("（");
    ctx.save(); ctx.globalAlpha = win(t, a - 0.4, b + 0.4, 0.4) * (echo ? 0.75 : 1);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = echo ? 'italic 400 42px "Noto Serif SC", serif' : '500 50px "Noto Serif SC", serif'; ctx.letterSpacing = "6px";
    ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.strokeText(txt, W / 2 + 3, H - 92);
    ctx.fillStyle = "#fff8ec"; ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = 12; ctx.fillText(txt, W / 2 + 3, H - 92);
    ctx.restore();
  }
}

function renderAt(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  let li = 0;
  for (const [mk, a, b] of SCENES) {
    if (t < a - FADE || t > b + FADE) continue;
    const al = Math.min(ss(a - FADE, a + FADE, t), 1 - ss(b - FADE, b + FADE, t));
    if (al <= 0) continue;
    const L = layers[li++ % 2], c = L.getContext("2d");
    c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = "source-over"; c.clearRect(0, 0, W, H);
    mk(c)(t);
    ctx.globalAlpha = a <= 0 ? 1 : al; ctx.drawImage(L, 0, 0); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = VIG; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(0,0,0,${Math.max(1 - ss(0, 2.5, t), ss(TL.duration - 2.5, TL.duration, t))})`; ctx.fillRect(0, 0, W, H);
  drawLyrics(t);
}

window.renderAt = renderAt;
window.ready = document.fonts.load('50px "Noto Serif SC"').then(() => document.fonts.load('700 110px "Noto Serif SC"')).then(() => document.fonts.load('italic 42px "Noto Serif SC"')).then(() => { renderAt(0); return true; });
</script>
