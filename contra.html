<meta name="claude:viewport-fit-sides" content="cover">
<title>钢铁突击</title>
<style>
  /* 霓虹军事街机风：深蓝夜战背景 + 橙红弹幕高光，单一深色世界 */
  :root {
    --bg: #0a0e1a; --sky1: #141b35; --sky2: #0a0e1a;
    --ground: #1c2238; --ground2: #141829;
    --fg: #e8ecf8; --muted: #7b86a8;
    --accent: #ff5a2c; --accent2: #ffd23f; --hp: #39d98a; --enemy: #c4406a;
    --panel: rgba(12,16,30,.82); --line: #2a3350;
    color-scheme: dark;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background:
      radial-gradient(120% 80% at 50% 0%, var(--sky1), var(--sky2));
    color: var(--fg); overflow: hidden; -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    position: relative; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: max(8px, env(safe-area-inset-top,0px)) max(8px, env(safe-area-inset-right,0px)) max(8px, env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px));
    box-sizing: border-box;
  }
  canvas {
    background: #0a0e1a; image-rendering: pixelated;
    border: 2px solid var(--line); border-radius: 8px;
    box-shadow: 0 0 40px rgba(255,90,44,.12), inset 0 0 60px rgba(0,0,0,.5);
    max-width: 100%; max-height: 100%; touch-action: none;
  }
  /* HUD + 覆盖层 */
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(90% 70% at 50% 40%, rgba(10,14,26,.72), rgba(10,14,26,.95));
    text-align: center; padding: 24px; box-sizing: border-box;
  }
  .overlay[hidden] { display: none !important; }
  h1 {
    margin: 0; font-size: clamp(34px, 9vw, 72px); letter-spacing: 4px;
    font-weight: 900; text-wrap: balance;
    color: var(--accent2);
    text-shadow: 0 0 18px rgba(255,210,63,.5), 3px 3px 0 var(--accent);
  }
  .sub { color: var(--muted); max-width: 30ch; line-height: 1.6; font-size: 15px; }
  .big { color: var(--accent); font-weight: 900; font-size: clamp(28px,7vw,52px); letter-spacing:2px; text-shadow: 0 0 16px rgba(255,90,44,.5); }
  button.start {
    font: inherit; font-weight: 800; letter-spacing: 2px; font-size: 18px;
    color: #0a0e1a; background: linear-gradient(180deg, var(--accent2), var(--accent));
    border: none; border-radius: 10px; padding: 14px 34px; cursor: pointer;
    box-shadow: 0 6px 0 #a8321a, 0 10px 24px rgba(255,90,44,.4);
    transition: transform .08s, box-shadow .08s;
  }
  button.start:active { transform: translateY(4px); box-shadow: 0 2px 0 #a8321a; }
  .keys { color: var(--muted); font-size: 13px; line-height: 1.9; }
  .keys b { color: var(--fg); font-weight: 700; }
  kbd {
    background: #1c2238; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 12px; color: var(--fg);
  }
  /* 触屏手柄 */
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .pad {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom,0px));
    display: flex; gap: 10px; pointer-events: auto;
  }
  .pad.left { left: max(14px, env(safe-area-inset-left,0px)); }
  .pad.right { right: max(14px, env(safe-area-inset-right,0px)); flex-direction: column-reverse; align-items: flex-end; }
  .tbtn {
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--line); color: var(--fg);
    font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(3px); -webkit-tap-highlight-color: transparent;
  }
  .tbtn.wide { width: auto; min-width: 72px; padding: 0 16px; border-radius: 30px; font-size: 15px; letter-spacing: 1px; }
  .tbtn:active, .tbtn.held { background: var(--accent); color: #0a0e1a; border-color: var(--accent); }
  .row { display: flex; gap: 10px; }
</style>

<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="touch">
    <div class="pad left">
      <div class="tbtn" data-k="left">◀</div>
      <div class="tbtn" data-k="down">▼</div>
      <div class="tbtn" data-k="right">▶</div>
    </div>
    <div class="pad right">
      <div class="row">
        <div class="tbtn" data-k="up">▲</div>
        <div class="tbtn" data-k="jump">⤒</div>
      </div>
      <div class="tbtn wide" data-k="fire">开火</div>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <h1>钢铁突击</h1>
    <div class="sub">丛林深处的敌军基地被攻陷了。你是最后的突击队员——一路向前，杀出一条血路。</div>
    <button class="start" id="startBtn">开始任务</button>
    <div class="keys">
      <b>键盘：</b><kbd>←</kbd><kbd>→</kbd> 移动 · <kbd>↑</kbd><kbd>↓</kbd> 瞄准 · <kbd>Z</kbd>/<kbd>空格</kbd> 跳跃 · <kbd>X</kbd>/<kbd>K</kbd> 开火（可长按）<br>
      <b>手机：</b>屏幕下方虚拟按键 · 拾取 <span style="color:var(--accent2)">⭐</span> 升级武器
    </div>
  </div>

  <div class="overlay" id="endScreen" hidden>
    <h1 id="endTitle">任务完成</h1>
    <div class="big" id="endMsg"></div>
    <div class="sub" id="endStat"></div>
    <button class="start" id="againBtn">再来一次</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const GROUND_Y = H - 90;         // 主地面
  const TAU = Math.PI * 2;

  // ---- 输入 ----
  const keys = { left:false, right:false, up:false, down:false, jump:false, fire:false };
  const KEYMAP = {
    ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
    KeyA:"left", KeyD:"right", KeyW:"up", KeyS:"down",
    Space:"jump", KeyZ:"jump", KeyJ:"jump",
    KeyX:"fire", KeyK:"fire"
  };
  addEventListener("keydown", e => {
    const k = KEYMAP[e.code];
    if (k) { keys[k] = true; if (k==="jump"||k==="fire"||e.code.startsWith("Arrow")||e.code==="Space") e.preventDefault(); }
  }, {passive:false});
  addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });

  // 触屏
  const touchEl = document.getElementById("touch");
  if (matchMedia("(pointer:coarse)").matches || "ontouchstart" in window) touchEl.classList.add("on");
  touchEl.querySelectorAll(".tbtn").forEach(btn => {
    const k = btn.dataset.k;
    const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add("held"); };
    const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove("held"); };
    btn.addEventListener("touchstart", on, {passive:false});
    btn.addEventListener("touchend", off, {passive:false});
    btn.addEventListener("touchcancel", off, {passive:false});
    btn.addEventListener("mousedown", on);
    addEventListener("mouseup", off);
  });

  // ---- 世界 / 关卡 ----
  const LEVEL_LEN = 5200;          // 关卡总长
  let camX = 0;
  // 悬空平台：{x,y,w}
  const platforms = [
    {x:620,y:GROUND_Y-120,w:150},
    {x:980,y:GROUND_Y-180,w:120},
    {x:1250,y:GROUND_Y-110,w:160},
    {x:1750,y:GROUND_Y-150,w:140},
    {x:2050,y:GROUND_Y-230,w:120},
    {x:2380,y:GROUND_Y-130,w:170},
    {x:2900,y:GROUND_Y-160,w:150},
    {x:3250,y:GROUND_Y-120,w:130},
    {x:3550,y:GROUND_Y-210,w:150},
    {x:4050,y:GROUND_Y-140,w:160},
    {x:4420,y:GROUND_Y-190,w:140},
  ];
  // 地面缺口（坑）：[x1,x2]
  const pits = [
    [1500,1600],[2220,2320],[3060,3160],[3840,3940],[4610,4710]
  ];
  function onGround(x){ for(const p of pits) if(x>p[0]&&x<p[1]) return false; return true; }
  // 找离 x 最近、双脚都踩在地上的位置（优先往回找），用于掉坑后复活
  function safeX(x){
    const ok = v => onGround(v+4) && onGround(v+player.w-4);
    for (let d=0; d<400; d+=10) { if (x-d>=camX+4 && ok(x-d)) return x-d; if (ok(x+d)) return x+d; }
    return x;
  }

  // ---- 实体 ----
  const player = {
    x:80, y:GROUND_Y-46, w:26, h:46, vx:0, vy:0, onFloor:false,
    face:1, aimUp:false, aimDown:false, cool:0, weapon:0, wtimer:0,
    lives:3, inv:0, dead:false, respawn:0
  };
  const WEAPONS = [
    {name:"步枪",  rate:11, speed:11, spread:0, dmg:1, color:"#ffd23f", r:4, pierce:false},
    {name:"散弹",  rate:20, speed:10, spread:3, dmg:1, color:"#ff8c3b", r:4, pierce:false},
    {name:"激光",  rate:7,  speed:17, spread:0, dmg:1, color:"#4fd6ff", r:3, pierce:true},
    {name:"机枪",  rate:5,  speed:13, spread:1, dmg:1, color:"#ff5a2c", r:3, pierce:false},
  ];

  let bullets = [], ebullets = [], enemies = [], pickups = [], particles = [], turrets = [];
  let score = 0, killed = 0, state = "menu", shakeT = 0, flashT = 0;
  const boss = { active:false, x:LEVEL_LEN-220, y:GROUND_Y-180, w:150, h:180, hp:90, maxhp:90, t:0, part:0, dead:false, intro:0 };

  const BOSS_NAME = "杨宣";
  const TAUNTS = ["就这？", "再来啊！", "你打不中我~", "我要认真了！", "有本事别躲！"];

  function reset() {
    camX = 0; bullets=[]; ebullets=[]; particles=[]; pickups=[];
    Object.assign(player, {x:80,y:GROUND_Y-46,vx:0,vy:0,onFloor:false,face:1,cool:0,weapon:0,wtimer:0,lives:5,inv:120,dead:false,respawn:0,anim:0,coyote:0});
    score=0; killed=0; shakeT=0; flashT=0;
    Object.assign(boss,{active:false,x:LEVEL_LEN-220,y:GROUND_Y-180,hp:90,t:0,say:"",sayT:0,lowSaid:false,part:0,dead:false,intro:0});
    buildEnemies();
  }

  function buildEnemies() {
    enemies = []; turrets = [];
    // 地面步兵
    const foot = [360,560,820,1120,1360,1680,1980,2280,2520,2760,3000,3320,3620,3900,4180,4480,4780,5000];
    for (const x of foot) if (onGround(x)) enemies.push(makeGrunt(x, GROUND_Y));
    // 平台哨兵
    for (const p of platforms) if (Math.random()<0.55) enemies.push(makeGrunt(p.x+p.w/2, p.y));
    // 固定炮台（天花板/地堡）
    [1150,1900,2650,3400,4100,4650].forEach((x,i)=>{
      turrets.push({x, y: i%2? 120 : GROUND_Y-30, w:40, h:40, cool: 40+ (i*13)%60, hp:4, dead:false, top:i%2===1});
    });
  }
  function makeGrunt(x,groundY){
    return {type:"grunt", x, y:groundY-40, w:24, h:40, vx:0, hp:2, cool:30+Math.random()*60|0, dead:false, groundY, t:Math.random()*60};
  }

  // ---- 玩法逻辑 ----
  function tryFire() {
    if (player.cool>0 || player.dead) return;
    const wp = WEAPONS[player.weapon];
    player.cool = wp.rate;
    let dx = player.face, dy = 0;
    if (player.aimUp && !keys.left && !keys.right) { dx = 0; dy = -1; }
    else if (player.aimUp) { dy = -0.8; }
    if (player.aimDown && !player.onFloor) { dx = keys.left||keys.right ? dx : 0; dy = 1; }
    const muzzleX = player.x + player.w/2 + dx*18;
    const muzzleY = player.y + 16 + dy*10;
    const shots = wp.spread ? wp.spread : 1;
    for (let i=0;i<shots;i++){
      let a = Math.atan2(dy, dx===0&&dy===0?player.face:dx);
      if (dx===0&&dy===0) a = player.face>0?0:Math.PI;
      a += (i-(shots-1)/2) * 0.16;
      bullets.push({x:muzzleX, y:muzzleY, vx:Math.cos(a)*wp.speed, vy:Math.sin(a)*wp.speed, dmg:wp.dmg, color:wp.color, r:wp.r, pierce:wp.pierce, life:70});
    }
    muzzleFlash(muzzleX, muzzleY);
    shakeT = Math.max(shakeT, 3);
  }

  function muzzleFlash(x,y){ for(let i=0;i<5;i++) particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:8,col:"#ffd23f",r:3}); }
  function boom(x,y,col="#ff8c3b",n=16){ for(let i=0;i<n;i++){const a=Math.random()*TAU,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:20+Math.random()*16,col,r:2+Math.random()*2});} shakeT=Math.max(shakeT,7); }

  function hurtPlayer() {
    if (player.inv>0 || player.dead) return;
    player.lives--; player.dead = true; player.respawn = 70; player.weapon = 0;
    boom(player.x+player.w/2, player.y+player.h/2, "#39d98a", 24);
    flashT = 8;
  }

  function update() {
    if (state!=="play") return;
    // ---- 玩家 ----
    if (!player.dead) {
      const SPD = 3.6;
      player.vx = (keys.right?SPD:0) - (keys.left?SPD:0);
      if (keys.right) player.face=1; if (keys.left) player.face=-1;
      player.aimUp = keys.up; player.aimDown = keys.down;
      // 走出地面边缘后的短暂时间内仍可起跳，踩空一点也不会直接掉下去
      if (keys.jump && (player.onFloor || player.coyote>0)) { player.vy = -12.8; player.onFloor=false; player.coyote=0; }
      player.vy += 0.6; if (player.vy>16) player.vy=16;
      player.x += player.vx; player.y += player.vy;

      // 坠落下平台的 down+jump
      // 边界
      if (player.x < camX+4) player.x = camX+4;
      if (player.x > LEVEL_LEN-40) player.x = LEVEL_LEN-40;

      // 地面 / 平台碰撞
      player.onFloor = false;
      const feet = player.y + player.h, cx = player.x + player.w/2;
      if (player.vy>=0 && (onGround(player.x+4) || onGround(player.x+player.w-4)) && feet>=GROUND_Y && feet<=GROUND_Y+22) { player.y=GROUND_Y-player.h; player.vy=0; player.onFloor=true; }
      for (const p of platforms) {
        if (player.vy>=0 && cx>p.x && cx<p.x+p.w && feet>=p.y && feet<=p.y+18 && !keys.down) {
          player.y = p.y - player.h; player.vy=0; player.onFloor=true;
        }
      }
      if (player.onFloor) player.coyote = 8; else if (player.coyote>0) player.coyote--;
      // 掉坑死亡
      if (player.y > H+40) hurtPlayer(), player.y=GROUND_Y-player.h, player.x=safeX(player.x);
      if (player.inv>0) player.inv--;
      if (player.cool>0) player.cool--;
      if (keys.fire) tryFire();
      if (player.onFloor && player.vx!==0) player.anim++; else if (player.onFloor) player.anim=0;
      // 武器计时
      if (player.weapon>0) { player.wtimer--; if (player.wtimer<=0) player.weapon=0; }
    } else {
      player.respawn--;
      if (player.respawn<=0) {
        if (player.lives<=0) { endGame(false); return; }
        player.dead=false; player.inv=150; player.vy=0;
        player.x=safeX(Math.max(camX+60,player.x)); player.y=GROUND_Y-player.h;
      }
    }

    // 摄像机：跟随但不回退，不越界
    const target = Math.min(Math.max(player.x - 300, camX), LEVEL_LEN - W);
    if (target>camX) camX += (target-camX)*0.12;
    camX = Math.max(0, Math.min(camX, LEVEL_LEN - W));

    // Boss 触发
    if (!boss.active && player.x > LEVEL_LEN - W + 120) { boss.active=true; boss.intro=120; boss.say="我是杨宣！想过去，先打赢我！"; boss.sayT=280; camX=LEVEL_LEN-W; }

    // ---- 子弹（玩家） ----
    for (const b of bullets) { b.x+=b.vx; b.y+=b.vy; b.life--; }
    // ---- 敌弹 ----
    for (const b of ebullets) { b.x+=b.vx; b.y+=b.vy; b.life--; }
    // ---- 粒子 ----
    for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.life--; }

    // ---- 敌人行为 ----
    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(e.x-(camX+W/2))>W) continue; // 屏幕外休眠
      e.t++;
      const dir = player.x>e.x?1:-1; e.face=dir;
      // 偶尔靠近
      if (e.t%8<4) e.x += dir*0.5;
      // 开火
      e.cool--;
      // 只朝正前方水平开火，玩家进入射程才打
      if (e.cool<=0 && !player.dead && Math.abs(player.x-e.x)<520) {
        e.cool = 120+Math.random()*80|0;
        const sx=e.x+e.w/2+dir*14, sy=e.y+18;
        ebullets.push({x:sx,y:sy,vx:dir*3.2,vy:0,r:5,life:220});
      }
    }
    // 炮台
    for (const t of turrets) {
      if (t.dead) continue;
      if (Math.abs(t.x-(camX+W/2))>W) continue;
      t.cool--;
      // 炮台只能朝 8 个固定方向开火，弹速慢
      if (t.cool<=0 && !player.dead) {
        t.cool=120+Math.random()*60|0;
        const sx=t.x+t.w/2, sy=t.y+t.h/2;
        const a=snap8(Math.atan2((player.y+20)-sy,(player.x+13)-sx));
        ebullets.push({x:sx,y:sy,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4,r:5,life:260});
      }
    }

    // ---- Boss ----
    if (boss.active && !boss.dead) {
      boss.t++;
      if (boss.t%300===150) { boss.say=TAUNTS[Math.random()*TAUNTS.length|0]; boss.sayT=110; }
      if (boss.hp<=25 && !boss.lowSaid) { boss.lowSaid=true; boss.say="顶不住了……我杨宣还会回来的！"; boss.sayT=150; }
      if (boss.sayT>0) boss.sayT--;
      if (boss.intro>0) boss.intro--;
      else {
        boss.y = GROUND_Y-180 + Math.sin(boss.t*0.03)*40;
        // 扇形弹：3 发慢速，弹道之间留出空隙可以躲
        if (boss.t%60===0) {
          const sx=boss.x+10, sy=boss.y+boss.h*0.5;
          for(let i=-1;i<=1;i++){ const a=Math.PI + i*0.3; ebullets.push({x:sx,y:sy,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4,r:6,life:300}); }
        }
        // 点射：开火前锁定一次方向，之后不再跟着玩家转
        if (boss.t%200===100) boss.aimA = Math.atan2((player.y+20)-(boss.y+30),(player.x+13)-(boss.x+10));
        if (boss.t%200>=100 && boss.t%200<130 && boss.t%10===0) {
          const sx=boss.x+10, sy=boss.y+30;
          ebullets.push({x:sx,y:sy,vx:Math.cos(boss.aimA)*4.5,vy:Math.sin(boss.aimA)*4.5,r:5,life:260,col:"#ffd23f"});
        }
      }
    }

    collisions();

    // 清理
    bullets = bullets.filter(b=>b.life>0 && b.x>camX-20 && b.x<camX+W+20 && b.y>-20 && b.y<H+20);
    ebullets = ebullets.filter(b=>b.life>0 && b.x>camX-30 && b.x<camX+W+30 && b.y>-30 && b.y<H+30);
    particles = particles.filter(p=>p.life>0);
    pickups = pickups.filter(p=>!p.taken);

    if (shakeT>0) shakeT--; if (flashT>0) flashT--;
  }

  function snap8(a){ return Math.round(a/(Math.PI/4))*(Math.PI/4); }
  function rectHit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
  function ptRect(px,py,r){ return px>r.x-6 && px<r.x+r.w+6 && py>r.y-6 && py<r.y+r.h+6; }

  function collisions() {
    // 玩家子弹 → 敌人/炮台/boss
    for (const b of bullets) {
      let gone=false;
      for (const e of enemies) {
        if (e.dead) continue;
        if (ptRect(b.x,b.y,e)) {
          e.hp-=b.dmg; boom(b.x,b.y,"#ffd23f",6);
          if(!b.pierce){gone=true;}
          if (e.hp<=0){ e.dead=true; killed++; score+=100; boom(e.x+e.w/2,e.y+e.h/2,"#c4406a",14);
            if (Math.random()<0.28) pickups.push({x:e.x+e.w/2,y:e.y,vy:-2,taken:false,t:0}); }
          if(gone) break;
        }
      }
      if (gone){b.life=0;continue;}
      for (const t of turrets) {
        if (t.dead) continue;
        if (ptRect(b.x,b.y,t)) { t.hp-=b.dmg; boom(b.x,b.y,"#ffd23f",6); if(!b.pierce)b.life=0;
          if(t.hp<=0){t.dead=true;killed++;score+=150;boom(t.x+t.w/2,t.y+t.h/2,"#ff8c3b",18);} break; }
      }
      if (boss.active && !boss.dead && boss.intro<=0 && b.life>0 && ptRect(b.x,b.y,boss)) {
        boss.hp-=b.dmg; boom(b.x,b.y,"#ffd23f",5); if(!b.pierce)b.life=0; score+=20;
        if (boss.hp<=0){ boss.dead=true; for(let i=0;i<40;i++) setTimeout(()=>boom(boss.x+Math.random()*boss.w,boss.y+Math.random()*boss.h,"#ff5a2c",10),i*35);
          score+=3000; setTimeout(()=>endGame(true),1600); }
      }
    }
    // 敌弹 → 玩家
    const pb={x:player.x+4,y:player.y+3,w:player.w-8,h:player.h-4};
    for (const b of ebullets) {
      if (!player.dead && player.inv<=0 && b.x>pb.x-b.r && b.x<pb.x+pb.w+b.r && b.y>pb.y-b.r && b.y<pb.y+pb.h+b.r) {
        b.life=0; hurtPlayer(); break;
      }
    }
    // 敌人身体 → 玩家
    if (!player.dead && player.inv<=0) {
      for (const e of enemies) if(!e.dead && rectHit(player,e)) { hurtPlayer(); break; }
      if (boss.active && !boss.dead && rectHit(player,boss)) hurtPlayer();
    }
    // 拾取
    for (const p of pickups) {
      p.t++; p.y += p.vy; p.vy += 0.08; if (p.vy>0&&p.y>GROUND_Y-16 && onGround(p.x)) {p.vy=0;p.y=GROUND_Y-16;}
      if (!p.taken && Math.abs(p.x-(player.x+player.w/2))<26 && Math.abs(p.y-(player.y+20))<34) {
        p.taken=true; player.weapon = 1+((player.weapon)%3); player.wtimer=600; score+=50;
        for(let i=0;i<10;i++) particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:18,col:"#ffd23f",r:2});
      }
    }
  }

  function endGame(win){
    state="over";
    document.getElementById("endTitle").textContent = win? "任务完成" : "阵亡";
    document.getElementById("endMsg").textContent = win? BOSS_NAME+" 已被击败！" : (boss.active? "败给了"+BOSS_NAME : "GAME OVER");
    document.getElementById("endMsg").style.color = win? "var(--hp)" : "var(--enemy)";
    document.getElementById("endStat").innerHTML = `得分 <b style="color:var(--accent2)">${score}</b> · 歼敌 <b style="color:var(--fg)">${killed}</b>`;
    document.getElementById("endScreen").hidden = false;
  }

  // ---- 渲染 ----
  function draw() {
    ctx.save();
    let sx=0, sy=0;
    if (shakeT>0){ sx=(Math.random()-.5)*shakeT; sy=(Math.random()-.5)*shakeT; }
    ctx.translate(sx,sy);

    // 背景层（视差）
    drawBackground();

    ctx.translate(-camX, 0);

    // 地面
    drawTerrain();

    // 平台
    for (const p of platforms) drawPlatform(p);

    // 拾取
    for (const p of pickups) drawStar(p.x, p.y, 11 + Math.sin(p.t*0.2)*1.5);

    // 炮台
    for (const t of turrets) if(!t.dead) drawTurret(t);

    // 敌人
    for (const e of enemies) if(!e.dead) drawGrunt(e);

    // Boss
    if (boss.active && !boss.dead) drawBoss();

    // 玩家
    if (!player.dead || (player.respawn>0 && player.lives>0 && (player.respawn%8<4))) drawPlayer();

    // 子弹
    for (const b of bullets){ ctx.fillStyle=b.color; ctx.shadowColor=b.color; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); }
    ctx.shadowBlur=0;
    for (const b of ebullets){ ctx.fillStyle=b.col||"#ff4d6d"; ctx.shadowColor="#ff4d6d"; ctx.shadowBlur=8; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill(); }
    ctx.shadowBlur=0;

    // 粒子
    for (const p of particles){ ctx.globalAlpha=Math.max(0,p.life/24); ctx.fillStyle=p.col; ctx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); }
    ctx.globalAlpha=1;

    ctx.restore();

    // 命中闪白
    if (flashT>0){ ctx.fillStyle=`rgba(255,80,80,${flashT/18})`; ctx.fillRect(0,0,W,H); }

    drawHUD();
    if (boss.active && boss.intro>0) drawBossBanner();
  }

  function drawBossBanner(){
    ctx.save(); ctx.globalAlpha=Math.min(1,boss.intro/30);
    ctx.fillStyle="rgba(10,14,26,.75)"; ctx.fillRect(0,H/2-60,W,120);
    ctx.fillStyle="#ff5a2c"; ctx.fillRect(0,H/2-60,W,4); ctx.fillRect(0,H/2+56,W,4);
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font="bold 22px Trebuchet MS, sans-serif"; ctx.fillText("⚠ WARNING · BOSS 来袭 ⚠", W/2, H/2-26);
    ctx.fillStyle="#ffd23f"; ctx.font="900 54px Trebuchet MS, sans-serif"; ctx.shadowColor="#ff5a2c"; ctx.shadowBlur=18;
    ctx.fillText(BOSS_NAME, W/2, H/2+18);
    ctx.restore();
  }

  function drawBackground(){
    // 每帧先铺满夜空，盖住上一帧，避免拖影
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#141b35"); sky.addColorStop(1,"#0a0e1a");
    ctx.fillStyle=sky; ctx.fillRect(-20,-20,W+40,H+40);
    // 远山
    ctx.fillStyle="#0e1430";
    const par = camX*0.2;
    for (let i=-1;i<8;i++){ const bx=i*260 - (par%260); ctx.beginPath(); ctx.moveTo(bx,GROUND_Y); ctx.lineTo(bx+130,GROUND_Y-170); ctx.lineTo(bx+260,GROUND_Y); ctx.closePath(); ctx.fill(); }
    // 月
    ctx.fillStyle="rgba(255,210,63,.14)"; ctx.beginPath(); ctx.arc(W-120,100,56,0,TAU); ctx.fill();
    ctx.fillStyle="rgba(255,210,63,.9)"; ctx.beginPath(); ctx.arc(W-120,100,42,0,TAU); ctx.fill();
    ctx.fillStyle="#141b35"; ctx.beginPath(); ctx.arc(W-104,88,40,0,TAU); ctx.fill();
    // 近树林剪影
    ctx.fillStyle="#0c1228";
    const par2=camX*0.5;
    for (let i=-1;i<12;i++){ const bx=i*180-(par2%180); ctx.fillRect(bx+20,GROUND_Y-110,10,110); ctx.beginPath(); ctx.arc(bx+25,GROUND_Y-120,34,0,TAU); ctx.fill(); }
  }

  function drawTerrain(){
    const g=ctx.createLinearGradient(0,GROUND_Y,0,H);
    g.addColorStop(0,"#1c2238"); g.addColorStop(1,"#0c1020");
    for (let x=0;x<LEVEL_LEN;x+=40){
      if (!onGround(x+20)) continue;
      ctx.fillStyle=g; ctx.fillRect(x,GROUND_Y,40,H-GROUND_Y);
    }
    // 地表高光线
    ctx.strokeStyle="#39d98a"; ctx.globalAlpha=.25; ctx.lineWidth=2;
    ctx.beginPath();
    for (let x=0;x<LEVEL_LEN;x+=40){ if(onGround(x+20)){ctx.moveTo(x,GROUND_Y+1);ctx.lineTo(x+40,GROUND_Y+1);} }
    ctx.stroke(); ctx.globalAlpha=1;
    // 坑里的尖刺
    ctx.fillStyle="#2a3350";
    for (const p of pits){ for(let x=p[0];x<p[1];x+=20){ ctx.beginPath(); ctx.moveTo(x,H); ctx.lineTo(x+10,H-26); ctx.lineTo(x+20,H); ctx.closePath(); ctx.fill(); } }
  }

  function drawPlatform(p){
    ctx.fillStyle="#242c48"; ctx.fillRect(p.x,p.y,p.w,14);
    ctx.fillStyle="#39d98a"; ctx.globalAlpha=.5; ctx.fillRect(p.x,p.y,p.w,3); ctx.globalAlpha=1;
    ctx.fillStyle="#161c30"; ctx.fillRect(p.x,p.y+14,p.w,6);
  }

  function drawStar(x,y,r){
    ctx.save(); ctx.translate(x,y); ctx.shadowColor="#ffd23f"; ctx.shadowBlur=12;
    ctx.fillStyle="#ffd23f"; ctx.beginPath();
    for(let i=0;i<10;i++){ const a=i*Math.PI/5 - Math.PI/2; const rr=i%2?r*0.45:r; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // 双腿：anim>=0 时按步频交替摆动并抬脚，anim<0 表示在空中收腿
  function drawLegs(hx, hy, f, anim, col, len){
    ctx.strokeStyle=col; ctx.lineWidth=7; ctx.lineCap="round";
    let l1x, l1y, l2x, l2y;
    if (anim<0) { l1x=hx+f*7; l1y=hy+len*0.6; l2x=hx-f*5; l2y=hy+len*0.75; }
    else {
      const s=Math.sin(anim*0.28);
      l1x=hx+s*8; l1y=hy+len-Math.max(0,-s)*5;
      l2x=hx-s*8; l2y=hy+len-Math.max(0,s)*5;
    }
    ctx.beginPath(); ctx.moveTo(hx-3,hy); ctx.lineTo(l1x-3,l1y); ctx.moveTo(hx+3,hy); ctx.lineTo(l2x+3,l2y); ctx.stroke();
    ctx.lineCap="butt";
  }

  function drawPlayer(){
    const x=player.x,y=player.y,f=player.face;
    ctx.save();
    if (player.inv>0 && !player.dead) ctx.globalAlpha=0.6;
    // 腿：地面跑动时交替摆动，空中收腿
    drawLegs(x+13, y+30, f, player.onFloor ? player.anim : -1, "#2f3a5e", 13);
    // 身体（突击队绿）
    ctx.fillStyle="#39d98a"; ctx.fillRect(x+3,y+12,20,20);
    ctx.fillStyle="#2bbd77"; ctx.fillRect(x+3,y+12,20,5);
    // 头盔
    ctx.fillStyle="#e8ecf8"; ctx.fillRect(x+6,y,14,12);
    ctx.fillStyle="#1c2238"; ctx.fillRect(f>0?x+14:x+6,y+4,6,4); // 面罩
    // 枪
    ctx.fillStyle="#ffd23f"; ctx.strokeStyle="#ffd23f"; ctx.lineWidth=4;
    let gx=x+player.w/2, gy=y+18, ex, ey;
    if (player.aimUp && !keys.left && !keys.right){ ex=gx; ey=y-14; }
    else if (player.aimUp){ ex=gx+f*20; ey=y-2; }
    else if (player.aimDown && !player.onFloor){ ex=gx; ey=y+40; }
    else { ex=gx+f*22; ey=gy; }
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.restore();
  }

  function drawGrunt(e){
    const x=e.x,y=e.y,f=e.face||1;
    drawLegs(x+12, y+28, f, e.t, "#3a2440", 9);
    ctx.fillStyle="#c4406a"; ctx.fillRect(x+2,y+10,20,20);
    ctx.fillStyle="#a1335a"; ctx.fillRect(x+2,y+10,20,5);
    ctx.fillStyle="#2a1830"; ctx.fillRect(x+6,y,12,11); // 头
    ctx.fillStyle="#ffd23f"; ctx.fillRect(f>0?x+12:x+8,y+3,5,3); // 眼
    ctx.strokeStyle="#2a1830"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+11,y+18); ctx.lineTo(x+11+f*16,y+18); ctx.stroke();
  }

  function drawTurret(t){
    ctx.fillStyle="#2a3350"; ctx.fillRect(t.x,t.y,t.w,t.h);
    ctx.fillStyle="#c4406a"; ctx.fillRect(t.x+6,t.y+6,t.w-12,t.h-12);
    ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(t.x+t.w/2,t.y+t.h/2,6,0,TAU); ctx.fill();
    // 瞄玩家的炮管
    const cx=t.x+t.w/2, cy=t.y+t.h/2;
    const a=snap8(Math.atan2((player.y+20)-cy,(player.x+13)-cx));
    ctx.strokeStyle="#7b86a8"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*22,cy+Math.sin(a)*22); ctx.stroke();
  }

  function drawBoss(){
    const b=boss;
    ctx.save();
    if (b.intro>0 && b.intro%6<3) ctx.globalAlpha=.7;
    // 主体机甲
    ctx.fillStyle="#2a3350"; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle="#1c2238"; ctx.fillRect(b.x,b.y,b.w,24);
    // 杨宣的脸：眼珠盯着玩家，残血时变哭脸
    const fx=b.x+64, fy=b.y+28, low=b.hp<=25;
    ctx.fillStyle="#c4406a"; ctx.fillRect(fx,fy,76,56);
    const lookX=Math.max(-3,Math.min(3,(player.x-fx)*0.02)), lookY=Math.max(-3,Math.min(3,(player.y-fy)*0.02));
    for (const ex of [fx+20, fx+56]) {
      ctx.fillStyle="#e8ecf8"; ctx.beginPath(); ctx.arc(ex,fy+18,8,0,TAU); ctx.fill();
      ctx.fillStyle="#0a0e1a"; ctx.beginPath(); ctx.arc(ex+lookX,fy+18+lookY,3.5,0,TAU); ctx.fill();
    }
    // 眉毛：平时怒眉，残血时八字眉
    ctx.strokeStyle="#0a0e1a"; ctx.lineWidth=4; ctx.beginPath();
    if (low) { ctx.moveTo(fx+12,fy+6); ctx.lineTo(fx+28,fy+2); ctx.moveTo(fx+48,fy+2); ctx.lineTo(fx+64,fy+6); }
    else { ctx.moveTo(fx+12,fy+2); ctx.lineTo(fx+28,fy+8); ctx.moveTo(fx+48,fy+8); ctx.lineTo(fx+64,fy+2); }
    ctx.stroke();
    // 嘴：平时坏笑露牙，残血时撇嘴
    ctx.lineWidth=2; ctx.beginPath();
    if (low) { ctx.lineWidth=4; ctx.arc(fx+38,fy+52,12,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }
    else {
      ctx.fillStyle="#e8ecf8"; ctx.fillRect(fx+22,fy+36,32,10); ctx.strokeRect(fx+22,fy+36,32,10);
      for (const tx of [fx+30, fx+38, fx+46]) { ctx.moveTo(tx,fy+36); ctx.lineTo(tx,fy+46); }
      ctx.stroke();
    }
    // 核心（弱点闪烁）
    const pulse=0.5+0.5*Math.sin(b.t*0.12);
    ctx.fillStyle=`rgba(255,90,44,${0.5+pulse*0.5})`; ctx.shadowColor="#ff5a2c"; ctx.shadowBlur=20;
    ctx.beginPath(); ctx.arc(b.x+40,b.y+b.h*0.5,20,0,TAU); ctx.fill(); ctx.shadowBlur=0;
    // 炮口
    ctx.fillStyle="#7b86a8"; ctx.fillRect(b.x-14,b.y+b.h*0.5-8,16,16);
    ctx.fillRect(b.x-14,b.y+30,14,12);
    // 腿
    ctx.fillStyle="#161c30"; ctx.fillRect(b.x+20,b.y+b.h,26,12); ctx.fillRect(b.x+b.w-46,b.y+b.h,26,12);
    ctx.restore();
    // 名牌 + 血条
    const bw=b.w, bx=b.x, by=b.y-16;
    ctx.fillStyle="#161c30"; ctx.fillRect(bx,by,bw,8);
    ctx.fillStyle="#ff5a2c"; ctx.fillRect(bx,by,bw*Math.max(0,b.hp/b.maxhp),8);
    ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.font="bold 18px Trebuchet MS, sans-serif";
    ctx.fillStyle="#ffd23f"; ctx.shadowColor="#ff5a2c"; ctx.shadowBlur=10;
    ctx.fillText(BOSS_NAME, bx+bw/2, by-8); ctx.shadowBlur=0;
    // 台词气泡
    if (b.sayT>0 && b.say && b.intro<=0) {
      ctx.font="bold 15px Trebuchet MS, sans-serif"; ctx.textBaseline="middle";
      const tw=ctx.measureText(b.say).width+24, tx=b.x-tw-24, ty=b.y+6;
      ctx.fillStyle="#e8ecf8"; ctx.fillRect(tx,ty,tw,32);
      ctx.beginPath(); ctx.moveTo(tx+tw,ty+10); ctx.lineTo(tx+tw+16,ty+16); ctx.lineTo(tx+tw,ty+24); ctx.fill();
      ctx.fillStyle="#0a0e1a"; ctx.fillText(b.say, tx+tw/2, ty+16);
    }
    ctx.textAlign="left";
  }

  function drawHUD(){
    // 分数
    ctx.fillStyle="rgba(12,16,30,.7)"; ctx.fillRect(10,10,220,56);
    ctx.strokeStyle="#2a3350"; ctx.strokeRect(10,10,220,56);
    ctx.fillStyle="#ffd23f"; ctx.font="bold 22px Trebuchet MS, sans-serif"; ctx.textBaseline="middle";
    ctx.fillText("分数 "+String(score).padStart(6,"0"), 24, 28);
    // 命
    ctx.fillStyle="#39d98a"; ctx.font="16px Trebuchet MS, sans-serif";
    let lifeStr="❤ ".repeat(Math.max(0,player.lives));
    ctx.fillText("剩余 "+Math.max(0,player.lives)+" 条命", 24, 50);
    // 武器
    const wp=WEAPONS[player.weapon];
    ctx.textAlign="right"; ctx.fillStyle=wp.color; ctx.font="bold 18px Trebuchet MS, sans-serif";
    ctx.fillText("武器：" + wp.name, W-20, 28);
    if (player.weapon>0){ ctx.fillStyle="#7b86a8"; ctx.font="12px Trebuchet MS"; ctx.fillText("剩余 "+Math.ceil(player.wtimer/60)+"s", W-20, 48); }
    ctx.textAlign="left";
    // 进度条
    const prog = Math.min(1, player.x/(LEVEL_LEN-200));
    ctx.fillStyle="#161c30"; ctx.fillRect(W/2-140,16,280,8);
    ctx.fillStyle="#39d98a"; ctx.fillRect(W/2-140,16,280*prog,8);
    ctx.fillStyle="#ff5a2c"; ctx.beginPath(); ctx.arc(W/2+140,20,7,0,TAU); ctx.fill(); // 终点=boss
    ctx.fillStyle="#e8ecf8"; ctx.font="bold 12px Trebuchet MS, sans-serif"; ctx.textAlign="center"; ctx.fillText(BOSS_NAME,W/2+140,38); ctx.textAlign="left";
  }

  // ---- 主循环 ----
  let last=0;
  function loop(t){ update(); draw(); requestAnimationFrame(loop); }

  // ---- 按钮 ----
  function begin(){ reset(); state="play"; document.getElementById("startScreen").hidden=true; document.getElementById("endScreen").hidden=true; }
  document.getElementById("startBtn").onclick = begin;
  document.getElementById("againBtn").onclick = begin;

  // 画初始菜单背景一帧
  draw();
  requestAnimationFrame(loop);
})();
</script>
